# Trivy counterpart to .docker/scout/pdp-v2.vex.json.
#
# Two scanners run against the PDP image and they consume waivers in different
# formats: Docker Scout reads the OpenVEX doc, Trivy reads this file. Both lists
# must say the same thing - if you add or drop a waiver, change BOTH files in the
# same commit. The OpenVEX doc carries the full reachability analysis; the
# `statement` fields here are deliberately short pointers to it.
#
# Every entry MUST carry `expired_at`. A waiver that never expires silently
# becomes permanent. Of the seven below, five exist only because opal-common 0.9.6
# caps the dependency that would otherwise fix them; the two x/crypto entries are
# blocked by the golang:1.25-bookworm builder instead. When the date passes, Trivy
# starts reporting the CVE again, which is the intended prompt to re-check
# whether OPAL has relaxed its cap yet. Push the date out deliberately; do not
# delete the field. See PER-15358.
vulnerabilities:
  # golang.org/x/crypto/ssh, reaching the image via /app/bin/opa (compiled from
  # permitio/permit-opa, which carries x/crypto as an indirect dep).
  #
  # Listed for PARITY even though Trivy does not currently report these two: its
  # gobinary analyzer did not flag them against x/crypto v0.55.0 in the rebuilt
  # binary, while Docker Scout does flag them at module level. The waiver files are
  # required to say the same thing, and an advisory-feed change should not be able to
  # turn a documented non-issue into a surprise gate failure.
  - id: CVE-2026-78662
    statement: >-
      not_affected / vulnerable_code_not_present. SSH mux connection-deadlock
      DoS. golang.org/x/crypto/ssh is NOT linked into /app/bin/opa - `go list -deps
      ./cmd/opa` in permit-opa resolves only cryptobyte, chacha20(+poly1305), pbkdf2,
      curve25519, blake2b, salsa20, nacl/*, hkdf and sha3 - and the PDP speaks no SSH.
      Fixed only in x/crypto >= 0.56.0, whose go.mod declares `go 1.26.0`; the blocker
      is the golang:1.25-bookworm builder and permit-opa's own `go 1.25.0`, not Go
      itself. See .docker/scout/pdp-v2.vex.json and permitio/permit-opa#49.
    expired_at: 2026-12-31
  - id: CVE-2026-56855
    statement: >-
      not_affected / vulnerable_code_not_present. Same package, same evidence
      as CVE-2026-78662: crafted post-establishment SSH channel messages deadlock the
      connection, in code that is never linked into the binary. Fixed only in
      x/crypto >= 0.56.0 (go.mod declares `go 1.26.0`; the blocker is local, not Go).
      See .docker/scout/pdp-v2.vex.json and permitio/permit-opa#49.
    expired_at: 2026-12-31
  # starlette is capped <1 by opal-common/opal-client 0.9.6 (and further to
  # <0.51.0 via fastapi-utils -> fastapi). No <1 backport exists for either CVE.
  - id: CVE-2026-48818
    statement: >-
      not_affected / vulnerable_code_not_in_execute_path. SSRF via UNC-path
      resolution in starlette.staticfiles, Windows-only. The PDP runs on Alpine
      Linux and mounts no StaticFiles. Fixed only in starlette >= 1.1.0, which
      opal-common's starlette<1 cap forbids. See .docker/scout/pdp-v2.vex.json.
    expired_at: 2026-12-31
  - id: CVE-2026-54283
    statement: >-
      not_affected / vulnerable_code_not_in_execute_path. request.form() size
      limits ignored for urlencoded bodies. The PDP is a JSON-only API: it never
      calls request.form() and does not depend on python-multipart. Fixed only in
      starlette >= 1.3.1, which opal-common's starlette<1 cap forbids.
      See .docker/scout/pdp-v2.vex.json.
    expired_at: 2026-12-31
  - id: CVE-2026-48710
    statement: >-
      not_affected / vulnerable_code_not_in_execute_path. A malformed Host header
      makes request.url.path diverge from the path actually routed, so a check that
      reads request.url can be bypassed. The PDP makes no security decision on
      request.url: auth is enforced per-route by FastAPI Depends (HTTPBearer in
      horizon/authentication.py), and the one path-keyed check - the write-route test
      in horizon/proxy/api.py - reads request.path_params, which this CVE leaves
      unaffected. Fixed only in starlette >= 1.0.1, which opal-common's starlette<1
      cap forbids. See .docker/scout/pdp-v2.vex.json.
    expired_at: 2026-12-31
  - id: CVE-2026-48817
    statement: >-
      not_affected / vulnerable_code_not_in_execute_path. Unsafe reflection in
      starlette.endpoints.HTTPEndpoint dispatch: the HTTP method is lowercased and
      resolved with getattr against the endpoint instance, without restricting the
      lookup to known verbs. The PDP defines no HTTPEndpoint or WebSocketEndpoint
      subclass - every route is a FastAPI APIRouter decorator with explicit methods -
      so the vulnerable dispatch class is never instantiated. Fixed only in starlette
      >= 1.1.0, which opal-common's starlette<1 cap forbids.
      See .docker/scout/pdp-v2.vex.json.
    expired_at: 2026-12-31
  # ddtrace is capped <4 by opal-common 0.9.6 (`ddtrace<4,>=3.0.0`).
  - id: CVE-2026-50271
    statement: >-
      not_affected / inline_mitigations_already_exist. Unbounded W3C baggage
      header extraction. The Dockerfile drops "baggage" from
      DD_TRACE_PROPAGATION_STYLE_EXTRACT, removing the vulnerable parser from the
      request path; it is only reachable at all when PDP_ENABLE_MONITORING=true
      (default false). Fixed only in ddtrace >= 4.8.2, which opal-common's
      ddtrace<4 cap forbids. See .docker/scout/pdp-v2.vex.json.
    expired_at: 2026-12-31
