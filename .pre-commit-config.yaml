repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-toml
      - id: check-yaml
        exclude: "^charts/.*"
      - id: check-xml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: a56c0b927e6465d37cae3e97d35d4d18ab2b96cd  # frozen: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/doublify/pre-commit-rust
    rev: eeee35a89e69d5772bdee97db1a6a898467b686e  # frozen: v1.0
    hooks:
      - id: cargo-check
        args: [--all-targets]
        files: \.rs$
      - id: fmt
        files: \.(rs|toml)$
        args: ["--verbose"]
        pass_filenames: false

  - repo: local
    hooks:
      - id: rust-clippy
        name: Rust clippy
        description: Run cargo clippy on files included in the commit. clippy should be installed before-hand.
        entry: cargo clippy --all-targets --all-features -- -Dclippy::all
        pass_filenames: false
        types: [file, rust]
        language: system

      - id: waiver-parity
        name: Trivy/OpenVEX waiver parity
        description: >-
          .trivyignore.yaml and .docker/scout/pdp-v2.vex.json must waive the same CVEs,
          and every Trivy waiver must carry an unexpired expired_at.
        entry: python .github/scripts/check_waiver_parity.py
        # `language: python` (not `system`): the script needs PyYAML, which a developer's
        # system interpreter is not guaranteed to have. pre-commit builds an isolated env
        # from additional_dependencies, so the hook works on a bare checkout.
        language: python
        additional_dependencies: ["pyyaml==6.0.3"]
        pass_filenames: false
        files: ^(\.trivyignore\.yaml|\.docker/scout/pdp-v2\.vex\.json)$

      - id: uv-lock-check
        name: uv.lock matches pyproject.toml
        description: >-
          Fails when pyproject.toml changed without `uv lock`. The image and CI install
          uv.lock with --frozen, so a stale lock would silently ship the old dependencies.
        entry: uv lock --check
        language: python
        additional_dependencies: ["uv==0.12.19"]
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$

      - id: ty-check
        name: ty type check
        description: >-
          Type-checks every Python file with the ty pinned in uv.lock's dev group, configured
          in pyproject.toml [tool.ty]. `uv run --frozen` first syncs .venv to uv.lock, so third-party
          types are those of the locked dependencies. Any diagnostic fails, warnings included.
        # The hook runs inside its own virtualenv (the one holding uv). Unsetting VIRTUAL_ENV
        # keeps uv on the project's .venv, which it would otherwise use with a mismatch warning.
        entry: env -u VIRTUAL_ENV uv run --frozen ty check
        language: python
        additional_dependencies: ["uv==0.12.19"]
        pass_filenames: false
        files: (\.pyi?|^pyproject\.toml|^uv\.lock)$
