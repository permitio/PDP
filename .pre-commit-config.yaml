repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-toml
      - id: check-yaml
        exclude: "^charts/.*"
      - id: check-xml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.6
    hooks:
      - id: ruff
        args: [--fix]
        files: \.py$
        types: [file]
      - id: ruff-format
        files: \.py$
        types: [file]

  #  - repo: https://github.com/pre-commit/mirrors-mypy
  #    rev: v1.13.0
  #    hooks:
  #      - id: mypy
  #        pass_filenames: false
  #        additional_dependencies:
  #          - pydantic
  #          - types-requests
  #        files: \.py$
  #        types: [ file ]

  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: cargo-check
        args: [--all-targets]
        files: \.rs$
      - id: fmt
        files: \.(rs|toml)$
        args: ["--verbose"]
        pass_filenames: false

  - repo: local
    hooks:
      - id: rust-clippy
        name: Rust clippy
        description: Run cargo clippy on files included in the commit. clippy should be installed before-hand.
        entry: cargo clippy --all-targets --all-features -- -Dclippy::all
        pass_filenames: false
        types: [file, rust]
        language: system

      - id: waiver-parity
        name: Trivy/OpenVEX waiver parity
        description: >-
          .trivyignore.yaml and .docker/scout/pdp-v2.vex.json must waive the same CVEs,
          and every Trivy waiver must carry an unexpired expired_at.
        entry: python .github/scripts/check_waiver_parity.py
        # `language: python` (not `system`): the script needs PyYAML, which a developer's
        # system interpreter is not guaranteed to have. pre-commit builds an isolated env
        # from additional_dependencies, so the hook works on a bare checkout.
        language: python
        additional_dependencies: ["pyyaml==6.0.3"]
        pass_filenames: false
        files: ^(\.trivyignore\.yaml|\.docker/scout/pdp-v2\.vex\.json)$
