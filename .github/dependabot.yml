# Dependabot version updates for the PDP.
#
# WHY: this repo had NO dependabot.yml at all. Dependabot *alerts* were on (and six of
# them sat unread on main), but nothing was proposing upgrades, so every dependency and
# every base image moved only when a human happened to touch it (PER-15358).
#
# The cooldown/group/limit shape and commit-message prefixes match the configs proposed
# for permitio/opal (#957) and permitio/permit-opa (#50), so reviewers learn one
# convention. No `labels:`: this repo has no `dependencies` label, and with `labels:`
# unset Dependabot creates and applies its defaults itself.
#
# WHAT THIS DOES *NOT* DO, so nobody retires the image scanning on the strength of it:
# Dependabot never looks inside a built image. It reads manifests. It cannot see the
# `apk upgrade` package set, and it cannot tell you that an image ALREADY PUBLISHED has
# picked up a CVE disclosed after its build. That gap is covered by
# scheduled-security-scan.yml, and the two are complementary rather than alternatives.
# See docs/image-vulnerability-management.md.
#
# `cooldown` note: default-days is supported on every ecosystem below, but the
# semver-specific knobs (semver-major-days etc.) are only supported on semver-strict
# ecosystems - uv and cargo here, NOT docker, github-actions or pre-commit. The cooldown is not
# noise reduction, it is supply-chain defence: most malicious-release incidents are
# caught within a week. Security updates are never delayed by cooldown.
version: 2
updates:
  # Python dependencies: pyproject.toml and uv.lock (the image installs the lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      # A ty release can report new diagnostics, and any diagnostic fails the required
      # `pre-commit` check through the ty-check hook. Its own group keeps that red PR apart
      # from the other bumps; Dependabot puts a dependency in the first group it matches, so
      # this one has to stay above minor-and-patch.
      ty:
        patterns: ["ty"]
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # starlette is CAPPED BY OPAL, not by us: opal-common/opal-client 0.9.6 require
      # `starlette<1`. It is pinned exactly in pyproject.toml so the OpenVEX/trivyignore
      # waiver PURLs stay bound to a known version, and the CVEs that would be fixed by
      # upgrading (CVE-2026-48818, CVE-2026-54283, CVE-2026-48710 and CVE-2026-48817) are
      # waived as unreachable instead.
      #
      # A Dependabot PR for it is therefore unmergeable by construction - it would bump
      # past OPAL's cap, break the resolve, and silently unbind the waivers. Ignoring it
      # keeps the queue honest rather than accumulating PRs nobody can merge.
      #
      # Removal gate: drop this entry the moment opal-common relaxes its cap. At that
      # point also delete the exact pin in pyproject.toml, the four .trivyignore.yaml
      # entries and the matching OpenVEX statements - they are one change, not three.
      # See PER-15358.
      #
      # ddtrace used to be listed here for the same reason (opal-common's ddtrace<4). It
      # is no longer: pyproject.toml's [tool.uv] override lifts that cap, so ddtrace
      # updates resolve like any other dependency (PER-17853).
      - dependency-name: "starlette"
      # Also capped by OPAL 0.9.6: `pydantic<2` and `tenacity<9`. scalar-fastapi 1.9.0+
      # requires pydantic>=2, so it is held at 1.8.x by the same cap. Drop these three
      # when OPAL moves to pydantic 2 and tenacity 9.
      - dependency-name: "pydantic"
        versions: [">=2"]
      - dependency-name: "tenacity"
        versions: [">=9"]
      - dependency-name: "scalar-fastapi"
        versions: [">=1.9.0"]
      # fastapi 0.126.0 and later require pydantic>=2.7, so 0.125.x is the ceiling under the
      # same OPAL pydantic<2 cap (see the fastapi note in pyproject.toml).
      - dependency-name: "fastapi"
        versions: [">=0.126.0"]
      # websockets is pinned exactly and bumped BY HAND on purpose. pyproject.toml
      # records why: during review of #329 the validated build shipped 16.1.1 and 17.0
      # published hours later, so the next rebuild would have carried an unvalidated
      # major straight into a release. The cooldown above narrows that window but does
      # not close it, and this package sits on the OPAL pub/sub path that pdp-tester
      # exercises end to end. Majors stay manual; minors and patches are fine.
      - dependency-name: "websockets"
        update-types: ["version-update:semver-major"]
      # opal-common and opal-client 0.9.9, the first final release after the 0.9.6 pinned in
      # pyproject.toml, declare Requires-Python <3.13 and cannot run on the 3.13 image (see the
      # note at that pin). uv ignores Requires-Python upper bounds when it locks, so Dependabot
      # would still open the PR and only the pytests job's pip check would catch it. 0.10 stays
      # in, so a release that lifts the bound still arrives as a PR. Drop these two once an
      # OPAL 0.9.x release supports Python 3.13.
      - dependency-name: "opal-common"
        versions: [">=0.9.7, <0.10"]
      - dependency-name: "opal-client"
        versions: [">=0.9.7, <0.10"]
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"

  # Rust dependencies (pdp-server + watchdog workspace members)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"

  # GitHub Actions versions
  # Note: cooldown.semver-major-days is not supported for github-actions
  # (Dependabot only supports it on semver-strict ecosystems like uv and cargo).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"

  # Docker base images
  # Note: cooldown.semver-major-days is not supported for docker
  # (Dependabot only supports it on semver-strict ecosystems like uv and cargo).
  #
  # This entry only earns its place because the Dockerfile now pins base images BY
  # DIGEST. Against a floating tag like `python:3.13-alpine3.23`, Dependabot has
  # nothing to propose when upstream rebuilds that tag in place - the tag string is
  # already current - so the silent rebuild stays invisible. With `tag@sha256:...`,
  # a rebuilt base becomes a digest-bump PR that CI actually validates. See the
  # comment above the FROM lines in the Dockerfile.
  #
  # Daily, not weekly: a rebuilt base is the signal a stale image needs, and a weekly
  # cadence would delay it by up to six more days.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    # The image runs 3.13 (requires-python ==3.13.*, and ddtrace 4.16 declares <3.15): a minor or
    # major python bump is a migration, not a dependency update. Without this, the updater offers
    # the highest tag of the same shape (3.15.x-alpine3.23) instead of the next 3.13 patch
    # (PER-17853).
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "deps"

  # The offline-mode test image is built by hand, not by CI, so it rots unnoticed.
  - package-ecosystem: "docker"
    directory: "/test_offline_mode"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    # Follows the main image's 3.13 line so the two move together; without this the updater
    # offers the highest tag of the same shape (another #391). See the "/" docker entry.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "deps"

  # Hook versions in .pre-commit-config.yaml (run by prek, which reads the same file).
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
