# The scheduled security scan: Trivy and Docker Scout over the PUBLISHED pdp-v2 tags, cargo
# audit over main's Cargo.lock, and the Dependabot alert feed, on one schedule, reporting
# through one Slack message.
#
# WHY THIS EXISTS
# The docker-scout gate in tests.yml is a BUILD-time gate. It can only ever see the CVEs
# that were known on the day the image was built, and it is the last word on that tag
# forever, because nothing rebuilds a released image. A tag that passed its gate keeps
# shipping the packages it was built with after Alpine publishes fixes for them; CVEs
# disclosed afterwards are real findings on that tag, yet often not a source defect at all -
# a rebuild of the untouched Dockerfile scans clean. See PER-15358.
#
# So this workflow scans what customers actually pull, on a clock. Each Trivy finding in the
# report says who has to act on it (a release rebuild, permit-opa, the golang base digest, a
# uv.lock update, an exact pin, or nobody yet because there is no fix) - the REBUILD/SOURCE
# split classify_image_cves.py also writes to each scan job's summary. A Python finding is
# never a rebuild: the report names main's locked version for a human to judge against the fix,
# or says main's lock still holds the version Trivy flagged, which a release cannot clear.
#
# Waivers come from .trivyignore.yaml, which mirrors .docker/scout/pdp-v2.vex.json.
#
# TWO SCANNERS, TWO COVERAGE SETS
# Trivy runs as a matrix over `latest` plus the newest release tag. Docker Scout runs in its
# own `scout-latest` job over `latest` only. That asymmetry is deliberate and is forced by
# how each tool waives: .trivyignore.yaml keys on CVE id, so it applies to any tag, while
# .docker/scout/pdp-v2.vex.json binds every waiver to a product PURL and therefore only to
# the names it lists. `latest` is a fixed string a static VEX doc can name; release tags
# rotate with every release and cannot be.
#
# CARGO AUDIT AND DEPENDABOT
# The `cargo-audit` job checks the crates compiled into the Rust binaries, which the image
# scanners do not reliably see. It reports every RustSec advisory; one with no CVSS v3
# score is listed as "unscored" rather than dropped.
#
# Dependabot is here too, in the `dependabot` job. It cannot report itself: a
# Dependabot-triggered run gets a read-only GITHUB_TOKEN and can read only the Dependabot
# secret store, so it can never reach Slack from its own PR runs, and GitHub publishes no
# `dependabot_alert` workflow trigger to hook. Polling its alerts API on this schedule is
# the only way to get that signal out. Alerts are filtered through .trivyignore.yaml, so a
# waived CVE is counted, not listed - adding a waiver also silences its Dependabot alert.
#
# GREEN MEANS THE SCANS RAN, NOT THAT NOTHING WAS FOUND
# Findings are reported, not failed: the run stays green when every scanner produced a
# readable report, whatever that report says, and the Slack message is the alert. A job goes
# red only when its scan did not complete - a scanner error, an unreadable report, an
# unreadable alert feed - or, in `verify-delivery`, when the message never reached Slack.
# The PR gate (tests.yml) and the release gate (release.yml) are different: they block.
#
# ONE MESSAGE
# The `report` job merges every scanner with format_security_report.py: one line per
# advisory, naming every scanner and tag that saw it, so agreeing scanners never read as
# several problems. Slack hears from this workflow only when there is a high/critical or
# unscored finding or a scan did not complete; a clean run stays silent, because an "all
# clear" on every run is how a channel gets muted.
name: Scheduled security scan

on:
  schedule:
    # Every third day. `*/3` in the DAY-OF-MONTH field means days 1, 4, 7, ... 31, so the gap
    # resets at each month boundary (31st to 1st is one day). Cron has no true "every 72
    # hours"; a short gap only means one extra report.
    #
    # Deliberately NOT on the hour: GitHub's docs say a scheduled run "can be delayed
    # during periods of high loads", that "high load times include the start of every
    # hour", and that queued jobs may be DROPPED rather than retried. Every report lists the
    # whole unwaived backlog, not a delta, so a dropped run loses nothing but time.
    #
    # Every third day rather than weekly: new CVEs land continuously, and a weekly cadence
    # leaves a published image exposed for up to six more days after an advisory.
    - cron: '17 6 */3 * *'
  workflow_dispatch:
    inputs:
      tags:
        description: 'Space-separated tags to scan (default: latest + newest release)'
        required: false
        type: string

# `vulnerability-alerts: read` is the ONLY permission that lets GITHUB_TOKEN call
# GET /repos/{owner}/{repo}/dependabot/alerts. It is not a synonym for anything older:
# `security-events: read` covers code scanning and does NOT grant Dependabot alerts, which
# is why every pre-2026 write-up says the endpoint needs a PAT with the `security_events`
# scope. It accepts only `read` or `none`. actionlint 1.7.12 does not know the key yet and
# reports it as an unknown scope; .github/actionlint.yaml carries the suppression and its
# removal gate.
permissions:
  contents: read
  vulnerability-alerts: read

concurrency:
  # Queue rather than cancel: a manual workflow_dispatch and the schedule can race, and a
  # cancelled scheduled run would leave nothing to say it happened.
  group: scheduled-security-scan
  cancel-in-progress: false

jobs:
  resolve-tags:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Resolve which published tags to scan
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAGS: ${{ inputs.tags }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAGS:-}" ]; then
            tags="$INPUT_TAGS"
          else
            # `latest` is what an unpinned `docker pull` gets. The newest non-prerelease
            # release tag is what a customer who pinned a version is running, and once a
            # newer release ships it is no longer `latest`, so scanning only `latest`
            # would miss it.
            newest="$(gh release list --repo "$REPO" --limit 30 \
                        --exclude-drafts --exclude-pre-releases \
                        --json tagName --jq '.[0].tagName // empty')"
            tags="latest ${newest}"
          fi
          # `read -a` splits on IFS without glob-expanding, which leaving $tags unquoted
          # would do. `sed '/^$/d'` drops the empty field present when the repo has no
          # non-prerelease release yet (newest="").
          read -r -a tag_list <<< "$tags"
          matrix="$(printf '%s\n' "${tag_list[@]}" | sed '/^$/d' \
                      | sort -u | jq -R . | jq -cs '{tag: .}')"
          if [ "$(printf '%s' "$matrix" | jq -r '.tag | length')" -eq 0 ]; then
            echo "::error::no tags resolved to scan"
            exit 1
          fi
          echo "Scanning: $tags"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  scan:
    needs: resolve-tags
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # required to upload the SARIF report to code scanning
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-tags.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Scans the published manifest, NOT a local build - that is the whole point.
      # `exit-code: '0'`: a finding is reported by the `report` job, never a red job.
      #
      # Deliberately WITHOUT `if: ${{ !cancelled() }}`, unlike every step after it. The only
      # step that can precede it is the checkout, and running Trivy without a checkout means
      # running it without .trivyignore.yaml - every waived CVE would come back as a finding.
      - name: Trivy scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: permitio/pdp-v2:${{ matrix.tag }}
          scanners: vuln
          severity: CRITICAL,HIGH
          # NOT `pkg-types`. The trivy CLI flag is `--pkg-types`, but the action's input
          # is still called `vuln-type` (its action.yaml even carries a
          # "# TODO: rename to pkg-types"), and it maps to TRIVY_PKG_TYPES internally.
          # An undeclared input is dropped silently, so `pkg-types:` here would look
          # deliberate and do nothing. Same trap as no-cache-filter(s) in release.yml.
          vuln-type: os,library
          trivyignores: .trivyignore.yaml
          format: json
          output: trivy-${{ matrix.tag }}.json
          exit-code: '0'

      - name: Trivy scan published image (SARIF for code scanning)
        # Load-bearing, not defensive: a step with no `if:` is skipped once anything
        # earlier in the job has failed, and a skipped SARIF upload leaves code scanning
        # showing yesterday's answer for this tag.
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: permitio/pdp-v2:${{ matrix.tag }}
          scanners: vuln
          severity: CRITICAL,HIGH
          # See the note on the step above: the input is `vuln-type`.
          vuln-type: os,library
          trivyignores: .trivyignore.yaml
          format: sarif
          output: trivy-${{ matrix.tag }}.sarif
          exit-code: '0'
          # Without this, the action drops the severity filter for SARIF output and code
          # scanning gets every severity, not the CRITICAL,HIGH set the report uses.
          limit-severities-for-sarif: true
          # Skips re-installing the Trivy binary; the DB is reused because the steps
          # share the same cache dir on disk.
          skip-setup-trivy: true

      - name: Upload SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-${{ matrix.tag }}.sarif
          category: published-image-${{ matrix.tag }}

      # Writes the REBUILD/SOURCE triage to this job's summary. Exits 2 when the report is
      # missing, empty or unparseable - the one case that turns this job red, because then
      # the scan did not complete. Findings exit 0.
      - name: Classify findings (REBUILD vs SOURCE)
        if: ${{ !cancelled() }}
        env:
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          python3 .github/scripts/classify_image_cves.py \
            --report "trivy-${TAG}.json" \
            --tag "${TAG}" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload raw scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-report-${{ matrix.tag }}
          path: trivy-${{ matrix.tag }}.json
          retention-days: 30

  # Docker Scout's periodic leg, mirroring the report+gate pair in tests.yml. It exists for
  # the same reason the build-time job runs two scanners: on a published image Scout can be
  # clean while Trivy finds dozens of CRITICAL/HIGH, and the failure modes run the other
  # way too - Scout reads Docker's own advisory feed and applies the OpenVEX reachability
  # statements, which Trivy cannot express.
  #
  # `latest` ONLY - see TWO SCANNERS, TWO COVERAGE SETS at the top of this file.
  scout-latest:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # required to upload the SARIF report to code scanning
      security-events: write
      # required for the Docker Hub OIDC login below; it only lets the job mint a GitHub ID
      # token. Granted to this job alone - nothing else in this workflow talks to Docker Hub
      # with an identity.
      id-token: write
    steps:
      - name: Checkout code
        # The OpenVEX doc the gate below reads lives in this repo, so the checkout is not
        # optional here: without it `vex-location` resolves to nothing and all five
        # waivers stop suppressing.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to Docker Hub (OIDC)
        # Scout resolves advisories through the Docker Scout API, which wants a Docker Hub
        # identity even for a public image - the same login tests.yml performs before its
        # Scout steps, and through the same OIDC connection (pull-only on permitio/pdp-v2,
        # matched by `repo:permitio/PDP:*`). A scheduled run's `sub` is the default
        # branch, `repo:permitio/PDP:ref:refs/heads/main`, which that rule covers.
        #
        # 1800s rather than the 300s default: this job pulls a remote image before Scout
        # analyses it, and a token that expired mid-job would read as a Scout failure.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          DOCKERHUB_OIDC_EXPIREIN: '1800'
        with:
          username: ${{ vars.DOCKERHUB_ORGANIZATION }}

      - name: Docker Scout CVE report (all severities)
        # Guarded for the same reason every scan/report step in this file is: a step with no
        # `if:` is skipped once anything earlier in the job has failed, and a skipped report
        # leaves code scanning showing yesterday's answer for this image.
        if: ${{ !cancelled() }}
        uses: docker/scout-action@221e7f4860634eeb1579e3bd7ca232e577bd1864 # v1.25.0
        with:
          command: cves
          # `registry://`, NOT the `local://` that tests.yml uses. There is no local image
          # store on a scheduled run - nothing was built or loaded - so `local://` cannot
          # resolve, and the bare `image://` default would try the local store first and
          # only then fall back. `registry://` says what is meant: read the published
          # manifest that customers actually pull.
          image: registry://permitio/pdp-v2:latest
          exit-code: false
          # All severities, NO VEX filtering, on purpose: this SARIF is what code scanning
          # gets, where a waived CVE should still be visible as a tracked, explained alert.
          # It is deliberately NOT the file the report reads - see the gate below.
          sarif-file: scout-latest-report.sarif
          summary: true
          # There is no PR on a scheduled run.
          write-comment: false

      - name: Docker Scout CVE scan (critical and high, VEX applied)
        id: scout-gate
        # Load-bearing, not defensive. Without it a failed report step skips this one, and
        # the report job would have nothing from Scout to read.
        if: ${{ !cancelled() }}
        uses: docker/scout-action@221e7f4860634eeb1579e3bd7ca232e577bd1864 # v1.25.0
        with:
          command: cves
          image: registry://permitio/pdp-v2:latest
          only-severities: critical,high
          # `false`: findings go to the report, not to a red job. A Scout ERROR (auth,
          # registry, API) still fails this step, which is a scan that did not complete.
          exit-code: false
          # THE file the report reads, and it has to be this one rather than the report
          # SARIF above, because only this step applies the OpenVEX waivers: the report's
          # SARIF still contains all five waived CVEs at critical/high.
          sarif-file: scout-latest-gate.sarif
          summary: true
          write-comment: false
          # Accept CVEs marked not_affected in .docker/scout/pdp-v2.vex.json. Scout matches
          # products on the full PURL string, so pointing this step at a tag the doc does
          # not list drops all five waivers silently.
          vex-location: .docker/scout
          only-vex-affected: true
          # REQUIRED: scout only *applies* VEX statements whose author matches its
          # accept-list, which defaults to `<.*@docker.com>`. Without this our statements
          # are displayed ("VEX: not affected") but NOT suppressed. Must match the `author`
          # field in pdp-v2.vex.json.
          vex-author: Permit.io

      - name: Upload SARIF report
        # `hashFiles` is empty when the report step produced no file at all. Handing
        # upload-sarif a missing path fails the step, which would paint this job red for
        # the wrong reason and bury whatever actually went wrong underneath it.
        if: ${{ !cancelled() && hashFiles('scout-latest-report.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: scout-latest-report.sarif
          # Distinct from the Trivy categories (`published-image-<tag>`), so the two
          # scanners' alerts coexist in code scanning instead of overwriting each other.
          category: published-image-scout-latest

      - name: Confirm the scan produced a readable report
        if: ${{ !cancelled() }}
        env:
          GATE_OUTCOME: ${{ steps.scout-gate.outcome }}
        run: |
          set -euo pipefail
          # Scout writes no SARIF when it finds nothing. After a SUCCESSFUL step that can
          # only mean zero findings, so an empty SARIF is the honest stand-in; after any
          # other outcome the scan did not complete and this job fails.
          if [ ! -s scout-latest-gate.sarif ] && [ "$GATE_OUTCOME" = success ]; then
            echo '{"version":"2.1.0","runs":[]}' > scout-latest-gate.sarif
          fi
          if ! jq -e '.runs | type == "array"' scout-latest-gate.sarif > /dev/null 2>&1; then
            echo "::error::Docker Scout produced no readable report for permitio/pdp-v2:latest (scan outcome: ${GATE_OUTCOME:-skipped}). See the steps above."
            exit 1
          fi

      - name: Upload the report for the report job
        if: ${{ !cancelled() && hashFiles('scout-latest-gate.sarif') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scout-gate-latest
          path: scout-latest-gate.sarif
          retention-days: 30

  # cargo audit over main's Cargo.lock: the crates compiled into the Rust binaries, which
  # the image scanners do not reliably see. Same pinned version and cache as tests.yml.
  cargo-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache cargo-audit
        id: cargo-audit-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-audit@0.22.2

      # A vulnerable crate is a finding for the report, not a red job: cargo audit's exit
      # status is ignored and only a missing or unreadable report fails here.
      - name: Audit Cargo.lock
        run: |
          set -euo pipefail
          status=0
          cargo audit --json > cargo-audit.json || status=$?
          if ! jq -e '.vulnerabilities.list | type == "array"' cargo-audit.json > /dev/null 2>&1; then
            echo "::error::cargo audit produced no readable report (exit ${status}). See the log above."
            exit 1
          fi
          echo "cargo audit: $(jq '.vulnerabilities.count' cargo-audit.json) vulnerable crate(s) in Cargo.lock."

      - name: Upload the report for the report job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-audit
          path: cargo-audit.json
          retention-days: 30

  # Runs in parallel with the scanners above, so its result lands in the same report. It
  # needs no image and shares nothing with them.
  dependabot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The scripts below run with PyYAML pinned to the version the `waiver-parity` pre-commit
      # hook uses, so this watcher and the blocking PR check cannot disagree about how
      # .trivyignore.yaml parses.
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.19'
          enable-cache: false

      - name: Fetch open Dependabot alerts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # --paginate merges the pages into one JSON array, which is what the scripts
          # expect. Without it a repo with more than 100 open alerts silently reports
          # only the first page.
          if ! gh api --paginate \
                 "repos/${REPO}/dependabot/alerts?state=open&per_page=100" \
                 > dependabot-alerts.json; then
            echo "::error::Could not read Dependabot alerts for ${REPO}. A 403 here means" \
                 "GITHUB_TOKEN lacks 'vulnerability-alerts: read' - check that this" \
                 "workflow's permissions block still grants it and that GitHub Advanced" \
                 "Security/Dependabot alerts are enabled on the repo." >&2
            exit 1
          fi

      # Exits 2 when the feed is unreadable - a scan that did not complete - and 0 whatever
      # the alerts say. The log lists the unwaived critical/high backlog.
      - name: Validate the alert feed
        run: |
          set -euo pipefail
          uv run --no-project --with pyyaml==6.0.3 \
            python .github/scripts/check_dependabot_alerts.py \
            --alerts dependabot-alerts.json --all

      - name: Upload the alerts for the report job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependabot-alerts
          path: dependabot-alerts.json
          retention-days: 30

  report:
    # ONE message for the whole run, merging every scanner. Each scanner hands over its
    # raw report as an artifact; `needs.scan.outputs.*` on a matrix job would carry one
    # arbitrary leg's values.
    needs: [resolve-tags, scan, scout-latest, cargo-audit, dependabot]
    # Not `success()`: a scanner job that went red is exactly what the report must say.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      notify: ${{ steps.build.outputs.notify }}
      status: ${{ steps.build.outputs.status }}
      headline: ${{ steps.build.outputs.headline }}
      message: ${{ steps.build.outputs.message }}
    steps:
      - name: Checkout code
        # The formatter, the waiver list, pyproject.toml (for exact pins) and uv.lock (for the
        # locked version the report names next to each Python finding) are read from the repo.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.19'
          enable-cache: false

      - name: Download the scanner reports
        # A scanner whose job died uploads nothing. That is not an error here: the formatter
        # reads a missing report as "did not complete". continue-on-error covers a download
        # that does fail (an artifact API error, or v8's default `digest-mismatch: error`),
        # so the report still goes out.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          # v8.0.1 bundles an unzip library that still calls the deprecated Buffer() constructor,
          # so every download warns DEP0005 (actions/download-artifact#484). Drop when fixed.
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          merge-multiple: true
          path: reports

      - name: Build the report
        id: build
        env:
          MATRIX: ${{ needs.resolve-tags.outputs.matrix }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # One --trivy per tag that was MEANT to be scanned, so a leg that uploaded nothing
          # reads as "did not complete" instead of disappearing from the message.
          trivy_args=()
          while IFS= read -r tag; do
            trivy_args+=(--trivy "${tag}=reports/trivy-${tag}.json")
          done < <(printf '%s' "$MATRIX" | jq -r '.tag[]?')

          uv run --no-project --with pyyaml==6.0.3 \
            python .github/scripts/format_security_report.py \
            --repo "$REPO" \
            --run-url "$RUN_URL" \
            "${trivy_args[@]}" \
            --scout "latest=reports/scout-latest-gate.sarif" \
            --cargo reports/cargo-audit.json \
            --dependabot reports/dependabot-alerts.json \
            --out security-report.txt \
            --headline-out security-report-headline.txt \
            --github-output "$GITHUB_OUTPUT"

          cat security-report.txt >> "$GITHUB_STEP_SUMMARY"
          # Random heredoc delimiters: the message carries third-party text (CVE titles,
          # package names), and a fixed delimiter appearing inside it could forge outputs.
          delim="PDP_REPORT_$(openssl rand -hex 16)"
          {
            printf 'headline=%s\n' "$(cat security-report-headline.txt)"
            printf 'message<<%s\n%s\n%s\n' "$delim" "$(cat security-report.txt)" "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Record the report status
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          STATUS: ${{ steps.build.outputs.status }}
        run: printf '%s\n' "$STATUS" > security-report-status.txt

      # Read by security-digest.yml, which reports the latest scan's headline every Monday.
      # The run's own conclusion cannot answer "were there findings" any more: it is green
      # whenever the scans ran.
      - name: Upload the report
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-report
          path: |
            security-report.txt
            security-report-headline.txt
            security-report-status.txt
          retention-days: 30

  # THE ONLY Slack sender in this workflow.
  notify:
    needs: report
    # Speak up on a high/critical finding or an incomplete scan, and when the report job
    # itself could not run - a missing report is not evidence of a clean scan. A fully
    # clean run stays silent.
    if: ${{ !cancelled() && (needs.report.result != 'success' || needs.report.outputs.notify == 'true') }}
    # `./`, not the `$/` zizmor's self-repository audit suggests: actionlint 1.7.12 rejects
    # `$/` in a job-level `uses:`, and only with `./` does it check `secrets:` against the
    # callee. A `./` call resolves from the caller's own commit, so nothing can drift.
    uses: ./.github/workflows/notify-slack.yml  # zizmor: ignore[self-repository]
    with:
      subject: scheduled security scan
      # `||` falls through on an empty string, which is what an unsuccessful report job
      # leaves behind; the notifier then renders `summary` with the `fail` header.
      status: ${{ needs.report.outputs.status || 'fail' }}
      summary: ${{ needs.report.outputs.headline || 'The scheduled security scan produced no report, so nothing has been cleared by any scanner. See the run log.' }}
      # Already escaped by format_security_report.py; sent verbatim.
      message: ${{ needs.report.outputs.message }}
    secrets:
      # Named rather than `inherit`: the notifier needs exactly this one secret, and
      # `inherit` hands a called workflow every secret the repo has. If the secret is ever
      # unset it arrives as the empty string and the notifier is a green no-op.
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # A swallowed delivery failure is invisible here in a way it is not elsewhere. The
  # notifier's send step carries `continue-on-error: true`, which forces that step's
  # CONCLUSION to success, so `needs.notify.result` reads 'success' even when the POST
  # failed; only the step's OUTCOME is truthful, and that is what the notifier exports as
  # `delivered`. This workflow is also silent by design on a clean day, so "the webhook
  # has been dead for a month" looks exactly like "nothing to report for a month" unless
  # something checks. 'skipped' means no webhook secret is configured, which is a
  # documented green no-op rather than a failure.
  verify-delivery:
    needs: notify
    if: >-
      ${{ !cancelled() && needs.notify.result == 'success'
          && needs.notify.outputs.delivered != 'success'
          && needs.notify.outputs.delivered != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail because the report never reached Slack
        env:
          DELIVERED: ${{ needs.notify.outputs.delivered }}
        run: |
          set -euo pipefail
          echo "::error::The scheduled security scan had something to report but the Slack notification failed to send (delivery outcome: ${DELIVERED}). Nobody was told. Check that SLACK_WEBHOOK_URL is still valid - an incoming webhook returns 410 Gone once it is revoked or its channel is archived."
          exit 1
