# Daily poll of the Dependabot alerts API, so a new CRITICAL/HIGH alert reaches Slack
# the next morning instead of the next Monday digest.
#
# WHY A POLL AND NOT A TRIGGER
# There is no `dependabot_alert` workflow trigger - `on:` has no such event. Dependabot
# also cannot notify Slack from its own PR runs: those get a read-only GITHUB_TOKEN and
# read only the (empty) Dependabot secret store, so no webhook is reachable from there.
# A scheduled workflow runs with the full Actions secret store, so this is the only
# route short of an external webhook relay.
#
# WHY IT IS QUIET
# Every open CRITICAL/HIGH alert on this repo today is a CVE already triaged and waived
# in .trivyignore.yaml. check_dependabot_alerts.py filters through that same list and
# through a 25-hour window, and the notify job is skipped when nothing new survives.
# Posting the same three waived CVEs every morning would get the channel muted, which
# is the only real failure mode an alerting workflow has.
name: Dependabot alert watch

on:
  schedule:
    # 06:43 UTC daily - after the published-image scan at 06:17, so the two security
    # notifications do not arrive in the same minute.
    #
    # Deliberately NOT on the hour. GitHub's own docs say a scheduled run "can be delayed
    # during periods of high loads", that "high load times include the start of every
    # hour", and that "some queued jobs may be dropped" - and a dropped run is not
    # retried. That matters more here than for the image scans, which are stateless
    # re-scans: this workflow carries a --new-since window, so a dropped run would leave
    # anything that landed that day outside the next run's window. The `total_unwaived`
    # branch on the notify job below is the real backstop; this just makes it rarer.
    - cron: '43 6 * * *'
  workflow_dispatch:
    inputs:
      all:
        description: 'Report the whole unwaived CRITICAL/HIGH backlog, not just the last 25 hours.'
        required: false
        type: boolean
        default: false

# `vulnerability-alerts: read` is the ONLY permission that lets GITHUB_TOKEN call
# GET /repos/{owner}/{repo}/dependabot/alerts. It is not a synonym for anything older:
# `security-events: read` covers code scanning and does NOT grant Dependabot alerts,
# which is why every pre-2026 write-up on this says the endpoint needs a PAT with the
# `security_events` scope. GitHub added this key to GITHUB_TOKEN in September 2026; it
# accepts only `read` or `none`, never `write`. If the fetch step 403s, that is the
# thing to check first - and the step says so rather than reporting zero alerts.
permissions:
  contents: read
  vulnerability-alerts: read

concurrency:
  group: dependabot-alert-watch
  # Queue rather than cancel. A manual `workflow_dispatch` and the 07:00 schedule can
  # race, and cancelling the scheduled run would drop a day out of the --new-since
  # window with nothing to say it happened.
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      new_count: ${{ steps.check.outputs.new_count }}
      # Exported as well as new_count because a DELTA alone is not enough to notice a
      # problem. `new_count` only sees the --new-since window, so a standing unwaived
      # backlog - or an alert that landed during a run GitHub dropped - is invisible to
      # it forever. The notify gate below branches on both.
      total_unwaived: ${{ steps.check.outputs.total_unwaived }}
      status: ${{ steps.result.outputs.status }}
      summary: ${{ steps.result.outputs.summary }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install the waiver loader's dependencies
        run: |
          set -euo pipefail
          # A venv, not `pip install --user`: the runner's system Python is PEP 668
          # externally-managed, so installing into it fails. Pinned to the same PyYAML
          # the `waiver-parity` pre-commit hook uses, so this watcher and the blocking
          # PR check cannot disagree about how .trivyignore.yaml parses.
          python3 -m venv "$RUNNER_TEMP/alert-venv"
          "$RUNNER_TEMP/alert-venv/bin/pip" install \
            --quiet --disable-pip-version-check pyyaml==6.0.3

      - name: Fetch open Dependabot alerts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ALERTS_FILE: ${{ runner.temp }}/dependabot-alerts.json
        run: |
          set -euo pipefail
          # --paginate merges the pages into one JSON array, which is what the script
          # expects. Without it a repo with more than 100 open alerts silently reports
          # only the first page.
          if ! gh api --paginate \
                 "repos/${REPO}/dependabot/alerts?state=open&per_page=100" \
                 > "$ALERTS_FILE"; then
            echo "::error::Could not read Dependabot alerts for ${REPO}. A 403 here means" \
                 "GITHUB_TOKEN lacks 'vulnerability-alerts: read' - check that this" \
                 "workflow's permissions block still grants it and that GitHub Advanced" \
                 "Security/Dependabot alerts are enabled on the repo. If this GitHub" \
                 "instance predates the vulnerability-alerts permission, the endpoint" \
                 "needs a PAT with the classic 'security_events' scope instead." >&2
            exit 1
          fi

      - name: Check for new unwaived CRITICAL/HIGH alerts
        id: check
        env:
          ALERTS_FILE: ${{ runner.temp }}/dependabot-alerts.json
          SLACK_FILE: ${{ runner.temp }}/dependabot-slack.txt
          # `false` on a schedule run, because the first operand is already false there.
          REPORT_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.all }}
        run: |
          set -euo pipefail

          # A function taking "$@", not an `args=()` array: expanding an EMPTY array as
          # "${args[@]}" is an unbound-variable error under `set -u` in bash before 4.4.
          # The runner has bash 5, so this would work today and break the day anything
          # runs it elsewhere. "$@" is empty-safe in every bash.
          watch() {
            # Exits non-zero only when the feed is unreadable, which must never be
            # mistaken for "nothing new" - `set -e` turns that into a red run.
            "$RUNNER_TEMP/alert-venv/bin/python" .github/scripts/check_dependabot_alerts.py \
              --alerts "$ALERTS_FILE" \
              --slack-output "$SLACK_FILE" \
              --github-output "$GITHUB_OUTPUT" \
              "$@"
          }

          if [ "$REPORT_ALL" = "true" ]; then
            watch --all
          else
            watch
          fi

      - name: Publish the result
        id: result
        env:
          NEW_COUNT: ${{ steps.check.outputs.new_count }}
          TOTAL_UNWAIVED: ${{ steps.check.outputs.total_unwaived }}
          WAIVED_COUNT: ${{ steps.check.outputs.waived_count }}
          SLACK_FILE: ${{ runner.temp }}/dependabot-slack.txt
        run: |
          set -euo pipefail
          summary="$(cat "$SLACK_FILE")"

          # `warn`, not `fail`: an alert needs a human, but nothing here is broken, and
          # the notifier renders `fail` as "failed".
          #
          # TOTAL_UNWAIVED escalates as well as NEW_COUNT. Gating on the window alone
          # would render a standing backlog of unwaived CRITICAL/HIGH as `ok`, which the
          # notifier prints with a green check and the word "clean" - the most misleading
          # thing this workflow could say.
          status=ok
          if [ "$NEW_COUNT" -gt 0 ] || [ "$TOTAL_UNWAIVED" -gt 0 ]; then
            status=warn
          fi

          # Always written, including on a quiet day. The run log is the only place that
          # says the watch ran at all when Slack stays silent by design.
          {
            printf '## Dependabot alert watch (%s)\n\n' "$status"
            printf '%s\n\n' "$summary"
            printf -- '- New unwaived CRITICAL/HIGH in window: %s\n' "$NEW_COUNT"
            printf -- '- Unwaived CRITICAL/HIGH open in total: %s\n' "$TOTAL_UNWAIVED"
            printf -- '- Suppressed by .trivyignore.yaml: %s\n' "$WAIVED_COUNT"
          } >> "$GITHUB_STEP_SUMMARY"

          # A random heredoc delimiter: the body carries third-party text (package
          # names, advisory ids) and a fixed marker could be forged out of it.
          delimiter="ALERTS_$(openssl rand -hex 16)"
          {
            printf 'status=%s\n' "$status"
            printf 'summary<<%s\n' "$delimiter"
            printf '%s\n' "$summary"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"

  notify:
    needs: [check]
    # Four reasons to post, and silence otherwise:
    #   - `check` did not succeed: an unreadable alert feed must not look like a quiet
    #     day, and a skipped notify job is indistinguishable from one.
    #   - something new and unwaived turned up.
    #   - anything unwaived is open AT ALL, whether or not it is new. Without this the
    #     workflow only ever reports a delta, so a backlog that predates the window - or
    #     one that landed during a scheduled run GitHub dropped, which its own docs warn
    #     happens at times of high load - is never mentioned again by any scheduled path.
    #     Costs nothing today: total_unwaived is 0, because the three open HIGH alerts
    #     are all waived in .trivyignore.yaml.
    #   - somebody dispatched the backlog report by hand and is waiting for the answer,
    #     even when the answer is "nothing".
    if: >-
      ${{ !cancelled() && (needs.check.result != 'success'
          || needs.check.outputs.new_count != '0'
          || needs.check.outputs.total_unwaived != '0'
          || (github.event_name == 'workflow_dispatch' && inputs.all)) }}
    uses: ./.github/workflows/notify-slack.yml
    with:
      subject: new Dependabot alerts
      # The fallbacks fire when `check` failed before writing its outputs - an empty
      # `status` is rejected by the notifier, which would swallow the whole message.
      status: ${{ needs.check.outputs.status || 'fail' }}
      # Folded, because an unquoted `${{ ... }}` containing a colon-space is not valid
      # YAML - actionlint rejects the file outright.
      summary: >-
        ${{ needs.check.outputs.summary || 'The Dependabot alert watch failed before it
        could read the alert feed. Open the run - a 403 on the alerts endpoint means
        GITHUB_TOKEN no longer has the vulnerability-alerts read permission.' }}
    # Named rather than `secrets: inherit`, which hands the notifier every secret this
    # repo has (zizmor flags it as `secrets-inherit`). Passing a secret that does not
    # exist is legal - it arrives as the empty string and the notifier becomes a green
    # no-op that prints a ::notice::.
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # The Slack message is this workflow's ONLY product. The scan workflows can afford a
  # swallowed delivery failure because their own red run still carries the signal; here
  # there is nothing else - and because the watch is silent by design on a quiet day,
  # "the webhook has been dead for a month" looks exactly like "nothing new for a month".
  #
  # `notify` cannot report this itself: `continue-on-error` on its send step forces that
  # step's CONCLUSION to success, so the job is green and `needs.notify.result` says
  # 'success'. The step's OUTCOME is still truthful, which is what the notifier exports
  # as `delivered`. 'skipped' means no webhook secret is configured, which is a
  # documented green no-op, not a delivery failure.
  verify-delivery:
    needs: [notify]
    if: >-
      ${{ !cancelled() && needs.notify.result == 'success'
          && needs.notify.outputs.delivered != 'success'
          && needs.notify.outputs.delivered != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail because the alert never reached Slack
        env:
          DELIVERED: ${{ needs.notify.outputs.delivered }}
        run: |
          set -euo pipefail
          echo "::error::Dependabot alerts were found but the Slack notification failed to send (delivery outcome: ${DELIVERED}). Nobody was told. Check that SLACK_WEBHOOK_URL is still valid - an incoming webhook returns 410 Gone once it is revoked or its channel is archived."
          exit 1
