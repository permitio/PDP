name: Helm test

on:
  pull_request:
    paths:
      - 'charts/pdp/**'

permissions:
  contents: read

jobs:
  helm_test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

      - name: Deploy Helm Chart in Kind Cluster
        working-directory: ./charts/pdp
        # Through env, not `${{ }}` in the script, so the key is never spliced into the
        # shell source.
        env:
          PDP_API_KEY: ${{ secrets.PDP_API_KEY }}
        run: |
          helm install pdp . --set pdp.ApiKey="$PDP_API_KEY" \
            --create-namespace --namespace pdp --wait

      - name: Show PDP logs in case of failure
        run: kubectl logs svc/permitio-pdp -n pdp
        if: failure()

      - name: Show PDP pod status
        run: kubectl get pods -n pdp
        if: always()
