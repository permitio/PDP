name: PDP CI Tests

on:
  pull_request:
  push:
    branches: [ master, main, v* ]
  workflow_call:
    secrets:
      PDP_TESTER_API_KEY:
        required: true
      CLONE_REPO_TOKEN:
        required: true
      # Consumed by the `notify-gate-failure` job at the bottom of this file, which hands
      # it to ./.github/workflows/notify-slack.yml. `required: false` on purpose: the
      # secret does not exist in this repository yet, and the notifier is a green no-op
      # that says so in a ::notice:: until it does. Declaring it is not cosmetic - on the
      # workflow_call path an UNdeclared secret only arrives when the caller says
      # `secrets: inherit`, so without this line a caller that passes secrets by name
      # would silently stop alerting. It is also what keeps `secrets.SLACK_WEBHOOK_URL`
      # out of actionlint's "not defined in object type" list.
      SLACK_WEBHOOK_URL:
        required: false
      # NOT declared here but still REQUIRED by the docker-scout job, which now runs on
      # the workflow_call path too (it used to be skipped on releases): DOCKERHUB_USERNAME
      # and DOCKERHUB_TOKEN. release.yml supplies them by calling this workflow with
      # `secrets: inherit`, which is why it works. If a future caller passes secrets
      # explicitly instead, the Docker Hub login fails and the CVE gate fails with it -
      # add them to that caller, or declare them here. See PER-15358.

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - uses: pre-commit/action@v3.0.1
  pytests:
    runs-on: ubuntu-latest
    steps:
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          # Keep in lockstep with the interpreter the image actually ships
          # (Dockerfile: python:3.13-alpine3.23). This job pinned 3.11.8 while the image
          # ran 3.10, so the unit suite never executed on the shipped interpreter and a
          # regression that only reproduces there could not fail CI. Patch version floats,
          # matching the Dockerfile base. Bump both together. See PER-15358.
          python-version: '3.13'

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Pytests
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
          pytest -s --cache-clear horizon/tests/

  build-pdp-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: permitio/permit-opa
          ref: main
          path: './permit-opa'
          token: ${{ secrets.CLONE_REPO_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pre build PDP tests
        run: |
          echo "next" > permit_pdp_version
          rm -rf custom
          mkdir custom
          build_root="$PWD"
          cd ./permit-opa
          find * \( -name '*go*' -o -name 'LICENSE.md' \) -print0 | xargs -0 tar -czf "$build_root"/custom/custom_opa.tar.gz --exclude '.*'

      - name: Build and load PDP Docker image
        uses: docker/build-push-action@v5
        with:
          push: false
          load: true
          context: .
          platforms: linux/amd64
          tags: permitio/pdp-v2:next
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Must match release.yml. Without it the image that pdp-tester exercises and
          # that docker-scout/Trivy gate is built from a possibly-stale cached `main`
          # stage, while the released image re-resolves `apk upgrade` and `pip install`
          # - so CI would be validating and scanning a DIFFERENT package set than the one
          # customers pull. Two ways that bites: a gate that passes on cached packages
          # while the release ships newer ones, and the reverse, a gate that fails on
          # packages the release would not actually contain.
          #
          # Plural input on purpose - `no-cache-filter` is the buildx CLI flag, the action
          # input is `no-cache-filters`, and an undeclared input is dropped (with an
          # `Unexpected input(s)` warning annotation, which is easy to miss in a green run).
          # See PER-15358 and the long note in release.yml.
          no-cache-filters: main

      - name: Save Docker image as artifact
        run: docker save permitio/pdp-v2:next -o pdp-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdp-image
          path: pdp-image.tar
          retention-days: 1

  pdp-tester:
    runs-on: ubuntu-latest
    needs: build-pdp-image
    # Cap the run so a hung tester fails fast instead of holding the runner
    # until GitHub's 360-minute default. The old k3d path was bounded by
    # `kubectl wait --timeout=600s`; the tester's own max_running_time only
    # applies in interval mode, not the run-once mode CI uses.
    timeout-minutes: 15
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: pdp-image

      - name: Load Docker image
        run: docker load -i pdp-image.tar

      # Checkout the pdp-tester repository
      - name: Checkout pdp-tester repository
        uses: actions/checkout@v4
        with:
          repository: "permitio/pdp-tester"
          token: ${{ secrets.CLONE_REPO_TOKEN }}
          path: './pdp-tester'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Cache pdp-tester's deps so each run doesn't re-resolve/re-download
          # from PyPI (faster, and resilient to transient PyPI outages).
          cache: "pip"
          cache-dependency-path: pdp-tester/pyproject.toml

      # Docker runtime backend: launch the PDP as a local container via aiodocker
      # (no k3d/Helm/kubectl). This is the runtime the pdp-tester maintainers
      # recommend for CI and sidesteps the AbsaOSS/k3d-action download breakage
      # (its default k3d v5.4.6 has no checksums.txt, so install.sh now 404s).
      - name: Install pdp-tester (docker extra)
        working-directory: ./pdp-tester
        run: pip install -e ".[docker]"

      - name: Run PDP tester against the local Docker PDP image
        working-directory: ./pdp-tester
        env:
          TOKEN: ${{ secrets.PDP_TESTER_API_KEY }}
          API_URL: https://permitio.api.stg.permit.io
          # Test the locally built image (loaded above) instead of pulling from
          # Docker Hub. LOCAL_IMAGE forces the runtime's local-only tag path, so
          # only permitio/pdp-v2:next is launched.
          LOCAL_IMAGE: permitio/pdp-v2
          # Preserve the previous Helm startTimeout, and keep crashed containers
          # around so the post-mortem step below can read their logs.
          START_TIMEOUT: "180"
          AUTO_REMOVE: "false"
          # pdp-tester's policy.* cases write policy SCHEMA -- roles, resource
          # types and relations on the stock File/Folder types -- into the shared
          # staging environment on every run, rather than only facts. This job
          # checks pdp-tester out at main with no pinned ref and otherwise runs
          # every case it discovers, so without this it would opt into that churn
          # silently the moment those cases landed. See permitio/pdp-tester#152.
          EXCLUDE_TESTS: '["policy.*"]'
        run: |
          set -o pipefail
          # The default GitHub Actions shell runs with `-e`, so capture the
          # tester's exit status explicitly (via `|| status=$?`) instead of
          # letting a non-zero exit abort the step before the log is parsed.
          status=0
          python -m pdp_tester --docker --local --tag next --skip-generate 2>&1 | tee /tmp/tester.log || status=$?
          if grep -q "test cases failed" /tmp/tester.log; then
            echo "::error::Some test cases failed!"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::pdp-tester exited with a non-zero status (${status})"
            exit 1
          fi

      - name: Capture PDP container state and logs
        if: always()
        run: |
          filter="label=pdp-tester.permit.io/managed-by=pdp-tester"
          echo "=== PDP containers (all states) ==="
          docker ps -a --filter "$filter" --format '{{.Names}}\t{{.Status}}' || true
          echo ""
          echo "=== PDP container logs ==="
          for name in $(docker ps -a --filter "$filter" --format '{{.Names}}'); do
            echo "--- ${name} ---"
            docker logs --tail 200 "$name" 2>&1 || true
          done

  docker-scout:
    runs-on: ubuntu-latest
    needs: build-pdp-image
    # Deliberately NOT gated on `github.event_name == 'pull_request'` any more. release.yml
    # reaches this workflow through `workflow_call`, where github.event_name is the caller's
    # event ('release') - so the PR-only condition meant the CVE gate was skipped on exactly
    # the runs that publish an image to Docker Hub. Releases went out ungated. Now that
    # build-and-push-pdp `needs: pdp-tests`, a failing gate blocks the push.
    # See PER-15358.
    permissions:
      # required to upload the SARIF report
      security-events: write
      # required to download the Docker image artifact
      contents: read
      # required to create a pull request comment with the SARIF report
      pull-requests: write
    # Counts have to cross the job boundary for `notify-gate-failure` below to say
    # anything more useful than "it went red". A step output is scoped to its own job, so
    # it only reaches another job by being re-published here. `parse_ok` travels with
    # them on purpose: "0 CRITICAL / 0 HIGH" from a scan that never parsed is exactly the
    # message that would talk someone out of looking.
    outputs:
      critical: ${{ steps.report.outputs.critical }}
      high: ${{ steps.report.outputs.high }}
      total: ${{ steps.report.outputs.total }}
      parse_ok: ${{ steps.report.outputs.parse_ok }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: pdp-image

      - name: Load Docker image
        run: docker load -i pdp-image.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Scout CVE report (all severities)
        uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
        with:
          command: cves
          image: local://permitio/pdp-v2:next
          exit-code: false
          # All severities, NO VEX filtering, on purpose: this SARIF is what gets uploaded
          # to code scanning, where a waived CVE should still be visible as a tracked,
          # explained alert. It is deliberately NOT the file the PR comment reads - see the
          # `sarif-file` note on the gate step below.
          sarif-file: scout-results.sarif
          # `summary` publishes to the GitHub Action SUMMARY page, not to the PR - it is
          # wanted on every run, releases especially, so it stays on (default true).
          # `write-comment` is the one that needs a PR to exist, so that is what used to be
          # gated once this job started running on releases too. Getting these the wrong
          # way round suppressed the release job summary while still attempting a PR
          # comment with no PR. Same conclusion reached independently in #335.
          #
          # `write-comment` is now off unconditionally rather than PR-gated: Scout's
          # findings arrive inside the unified `<!-- pdp-image-scan -->` sticky comment
          # posted further down, so leaving Scout's own comments on would put three bot
          # comments on every PR instead of one.
          summary: true
          write-comment: false

      - name: Docker Scout CVE gate (high and critical)
        id: scout-gate
        uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
        with:
          command: cves
          image: local://permitio/pdp-v2:next
          only-severities: critical,high
          exit-code: true
          # THE file the unified PR comment and its fail step read. It has to be this one
          # and not scout-results.sarif above, because only this step applies the OpenVEX
          # waivers: the report step's SARIF still contains all seven waived CVEs at
          # critical/high, so counting it would fail every PR on known non-issues. Reading
          # the gate's own output instead means the comment shows, and the fail step blocks
          # on, exactly the finding set this step already exits non-zero for - the gate
          # neither loosens nor tightens, it just gains a readable report.
          sarif-file: scout-gate.sarif
          # Defaults are true for both; this step runs on releases now, where there is no
          # PR to comment on. Off unconditionally for the same reason as the report step:
          # one unified sticky comment, not three.
          write-comment: false
          # Accept CVEs marked not_affected in the OpenVEX doc (see
          # .docker/scout/pdp-v2.vex.json) so the gate does not fail on
          # vulnerabilities whose code path the PDP never executes and for which
          # no usable fix is available: starlette CVE-2026-48710 / CVE-2026-48817 /
          # CVE-2026-48818 / CVE-2026-54283, all fixed only in starlette >=1.x, which
          # OPAL's starlette<1 cap forbids; ddtrace CVE-2026-50271, fixed only in
          # ddtrace >=4.8.2, which OPAL's ddtrace<4 cap forbids and which the Dockerfile
          # mitigates by dropping "baggage" from the extract styles; and x/crypto
          # CVE-2026-78662 / CVE-2026-56855, which live in golang.org/x/crypto/ssh - a
          # package `go list -deps ./cmd/opa` proves is not linked into /app/bin/opa - and
          # which are fixed only in x/crypto >=0.56.0, whose go.mod declares `go 1.26.0`.
          # Go 1.26 has been stable since 2026-02-10 (1.26.8 is current, and 1.27.0 is out)
          # - the blocker is local, not upstream. The OPA builder is still
          # golang:1.25-bookworm (the opa_build stage) and permit-opa's go.mod is `go 1.25.0`,
          # and the official golang images ship GOTOOLCHAIN=local so the toolchain cannot
          # move implicitly. Gated on PDP#334 plus a matching permit-opa change, not on Go.
          # See PER-15358.
          #
          # NOTE: this gate reads packages, so it does not flag the CPython interpreter
          # itself the way a CPE-based scanner does - that blind spot is why four Python
          # CVEs reached a customer scan of 0.9.14-rc1 without failing CI (PER-15532).
          vex-location: .docker/scout
          only-vex-affected: true
          # REQUIRED: docker scout only *applies* VEX statements whose author
          # matches its accept-list, which defaults to `<.*@docker.com>`. Without
          # this, our Permit.io-authored statements are matched and displayed
          # ("VEX: not affected") but NOT suppressed, so the gate still fails on
          # the waived CVEs. Must match the `author` field in pdp-v2.vex.json.
          #
          # SCOPE OF THE VEX DOC: every statement in pdp-v2.vex.json binds its product to
          # `pkg:docker/permitio/pdp-v2@next`, which matches the `local://...:next` image
          # scanned here and nothing else. That is correct precisely BECAUSE this gate is
          # the only consumer of the OpenVEX doc - the scheduled re-scan of the published
          # tags uses Trivy, which reads .trivyignore.yaml and keys on CVE id, so tag
          # names never enter into it. If Scout is ever pointed at `:latest` or a release
          # tag, every product @id here has to be extended first or all seven waivers
          # stop suppressing and the run goes red on known non-issues.
          vex-author: Permit.io

      # SECOND SCANNER, on purpose. The Scout gate above reads the image's package
      # manifests, which is why the NOTE on it says it cannot see the CPython interpreter
      # itself the way a CPE-based scanner does - four Python CVEs reached a customer scan
      # of 0.9.14-rc1 without failing this job (PER-15532). Trivy resolves the Alpine
      # package DB and the Python/Go package trees independently and carries its own
      # advisory feed, so the two disagree in useful ways: on the published 0.9.14 image
      # Scout was clean while Trivy found 31 CRITICAL/HIGH, including a CRITICAL GitPython
      # RCE (CVE-2026-78676) that the customer's own OS-only scan also missed.
      #
      # Waivers live in .trivyignore.yaml, which must stay in sync with the OpenVEX doc
      # Scout reads. Both files change together or neither does.
      #
      # `if: !cancelled()` is REQUIRED, not defensive. A step with no `if:` is skipped as
      # soon as an earlier step in the job fails, so without it this gate only ran when the
      # Scout gate passed - the first CI run of this job reported "Docker Scout CVE gate:
      # failure / Trivy CVE gate: skipped" and the second opinion was never collected. A
      # run where Scout fails is exactly the run where it is most worth having. `!cancelled()`
      # rather than `always()` so a cancelled workflow still stops promptly. The job still
      # fails if either gate fails; both now report on every run. Guard any third scanner
      # the same way. The Trivy leg is now four steps (scan, format, comment, fail) and
      # every one of them carries the guard - dropping it from any single step puts the
      # whole leg back to being skipped the moment Scout goes red.
      - name: Trivy CVE scan (JSON report)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: permitio/pdp-v2:next
          scanners: vuln
          severity: CRITICAL,HIGH
          # NOT `pkg-types`. The trivy CLI flag is `--pkg-types`, but the action's input
          # is still called `vuln-type` (its action.yaml even carries a
          # "# TODO: rename to pkg-types"), and it maps to TRIVY_PKG_TYPES internally.
          # An undeclared input is dropped silently, so `pkg-types:` here would look
          # deliberate and do nothing. Same trap as no-cache-filter(s) in release.yml.
          vuln-type: os,library
          trivyignores: .trivyignore.yaml
          format: json
          output: trivy-pr.json
          # `exit-code: '0'` is NOT a relaxation. Trivy's own exit code makes a bad gate:
          # it is non-zero on ANY finding, so the step died before anything could read the
          # report and the PR got a red X pointing at a log nobody opens. The scan now
          # always succeeds, the report always renders, and the fail step below decides.
          #
          # NET GATE BEHAVIOUR IS UNCHANGED. With `severity: CRITICAL,HIGH` +
          # `trivyignores: .trivyignore.yaml` + `ignore-unfixed: false`, every vulnerability
          # that can reach trivy-pr.json is by definition an unwaived CRITICAL or HIGH -
          # precisely the set that made `exit-code: '1'` fail. So "critical + high > 0" in
          # the fail step is the old condition, evaluated two steps later. The fail step
          # additionally blocks when the report cannot be parsed, which the old exit code
          # could not express at all.
          exit-code: '0'
          # Report findings that have no fix yet, rather than hiding them. An unfixable
          # CVE is the case that needs a human decision (bump, drop, or waive with a
          # documented reachability argument), so it must not be silently dropped.
          ignore-unfixed: false

      # ONE comment per PR, covering BOTH scanners, keyed by the `<!-- pdp-image-scan -->`
      # marker the formatter emits as the body's first line.
      #
      # The formatter always exits 0 and always emits a marked body, even when a report is
      # missing or unparseable - a silent PR is worse than a red one, and the blocking
      # decision belongs to the fail step (which reads `parse_ok`), not to this step's exit
      # code. stdout is discarded: the body is third-party advisory text and is dumped to
      # the log under a `::stop-commands::` guard in the fail step instead.
      - name: Format image vulnerability report
        id: report
        if: ${{ !cancelled() }}
        env:
          SCOUT_GATE_OUTCOME: ${{ steps.scout-gate.outcome }}
        run: |
          set -euo pipefail
          # An absent scout-gate.sarif normally means Scout never produced a verdict, and
          # the formatter is right to call that "unavailable" and set parse_ok=false so the
          # fail step blocks. The one exception is a gate step that SUCCEEDED and wrote
          # nothing, which can only mean it found nothing: Scout has already asserted the
          # image is clean of unwaived critical/high, so an empty SARIF is the honest
          # stand-in. Every other outcome - failure, skipped, cancelled - leaves the file
          # absent and the build fails closed.
          if [ ! -s scout-gate.sarif ] && [ "${SCOUT_GATE_OUTCOME}" = "success" ]; then
            echo '{"version":"2.1.0","runs":[]}' > scout-gate.sarif
            echo "::notice title=Docker Scout wrote no SARIF::The Scout gate passed without producing scout-gate.sarif; reporting it as zero findings."
          fi
          python3 .github/scripts/format_scan_report.py \
            --trivy trivy-pr.json \
            --scout-sarif scout-gate.sarif \
            --image permitio/pdp-v2:next \
            --out scan-comment.md \
            --github-output "$GITHUB_OUTPUT" > /dev/null

      # Update-or-create against the marker, so a PR collects one comment that is rewritten
      # on every push rather than a wall of them.
      #
      # All four guards are load-bearing:
      #   - `!cancelled()` so the comment still posts on the run where the gate FAILED,
      #     which is the run where it matters most.
      #   - `steps.report.outcome == 'success'` because scan-comment.md does not exist
      #     otherwise.
      #   - the fork check, because PDP is public: on a fork PR GITHUB_TOKEN is read-only
      #     and createComment 403s, turning the gate red for the wrong reason. Do NOT
      #     "fix" that with pull_request_target - it would run untrusted head code with
      #     this repo's secrets.
      #   - the Dependabot check, because Dependabot-triggered runs get the same read-only
      #     token.
      # On every skipped path the fail step below still writes the identical markdown to
      # the job summary and one ::error:: annotation per finding, so nothing is lost.
      #
      # Stays on the default GITHUB_TOKEN: the dedup match is on the
      # `github-actions[bot]` author login, and a PAT or App token would change it and
      # start a fresh comment chain.
      - name: Post unified scan comment
        if: |
          !cancelled()
          && steps.report.outcome == 'success'
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pdp-image-scan -->';
            const body = fs.readFileSync('scan-comment.md', 'utf8');

            // github.paginate, not a bare listComments: the API defaults to 30 comments
            // per page, so on a busy PR the marked comment falls off page 1 and every
            // subsequent push appends a new one instead of updating.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c =>
              c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # The gate itself, split out from the scanners so the report is always rendered
      # before anything decides to fail. It is also the only surface on the runs where the
      # comment step is skipped (fork PRs, Dependabot PRs, pushes and releases), which is
      # why it writes the full markdown to the job summary unconditionally.
      #
      # Values arrive through `env:`, never as `${{ }}` inside the script body - that is
      # zizmor's template-injection rule, and the substituted values here are derived from
      # third-party advisory data.
      - name: Fail on unwaived CRITICAL/HIGH findings
        if: ${{ !cancelled() }}
        env:
          CRITICAL: ${{ steps.report.outputs.critical }}
          HIGH: ${{ steps.report.outputs.high }}
          TOTAL: ${{ steps.report.outputs.total }}
          PARSE_OK: ${{ steps.report.outputs.parse_ok }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
        run: |
          set -uo pipefail

          # FAIL CLOSED. A scanner that crashed, or a report the formatter could not
          # parse, must never read as clean - a zero-byte report silently classified as
          # CLEAN is the exact bug this replaces.
          if [ "${REPORT_OUTCOME}" != "success" ] || [ "${PARSE_OK:-}" != "true" ]; then
            {
              echo "## PDP image vulnerability report - the scan did not complete"
              echo ""
              echo "Report step outcome: \`${REPORT_OUTCOME}\`. parse_ok: \`${PARSE_OK:-unset}\`."
              echo ""
              echo "Failing closed. Check the Trivy scan and Docker Scout steps above:"
              echo "a missing or unparseable report is not a clean image."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Image scan did not complete::The vulnerability report could not be produced or parsed (outcome=${REPORT_OUTCOME}, parse_ok=${PARSE_OK:-unset}). Failing closed - a scan that did not run is not a clean scan."
            exit 1
          fi

          # Same markdown as the PR comment. The formatter already escapes every
          # scanner-supplied cell, so this is safe to append verbatim.
          cat scan-comment.md >> "$GITHUB_STEP_SUMMARY"

          # The log copy is not: a CVE title containing `::error::` or `::endgroup::`
          # would hijack the workflow-command stream and could forge a passing
          # annotation next to the real failure. ::stop-commands:: with a per-run token
          # disarms the whole block.
          STOP_TOKEN="pdp-image-scan-${GITHUB_RUN_ID}-${RANDOM}"
          echo "::group::PDP image vulnerability report"
          echo "::stop-commands::${STOP_TOKEN}"
          cat scan-comment.md
          echo "::${STOP_TOKEN}::"
          echo "::endgroup::"

          if [ "${CRITICAL:-0}" -eq 0 ] && [ "${HIGH:-0}" -eq 0 ]; then
            echo "No unwaived CRITICAL or HIGH findings (${TOTAL:-0} finding(s) reported in total)."
            exit 0
          fi

          # One annotation per finding, from both scanners. GitHub caps the annotations
          # panel near 10, which is why the full table went to the job summary above -
          # but on a fork PR these annotations and that summary are the ONLY surface.
          #
          # `%`, CR and LF are the workflow-command escapes; `,` and `:` are structural
          # inside a `title=` property, so they get encoded there too. Titles are cut at
          # 200 characters to stay legible in the checks UI.
          ESCAPES='
            def escmsg: tostring | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
            def escprop: escmsg | gsub(","; "%2C") | gsub(":"; "%3A");
          '
          if ! jq -r "${ESCAPES}"'
            .Results[]? | .Vulnerabilities[]?
            | select((.Severity // "") | ascii_upcase | . == "CRITICAL" or . == "HIGH")
            | "::error title=Trivy \((.Severity // "?") | escprop) - \((.PkgName // "?") | escprop)::\((.VulnerabilityID // "?") | escmsg) in \((.PkgName // "?") | escmsg) \((.InstalledVersion // "?") | escmsg) - fixed in \((.FixedVersion // "") | if . == "" then "no fix available" else . end | escmsg) - \((.Title // "") | .[0:200] | escmsg)"
          ' trivy-pr.json; then
            echo "::warning title=Trivy annotations unavailable::Could not render per-finding annotations from trivy-pr.json. The full table is in the job summary."
          fi
          if [ -s scout-gate.sarif ] && ! jq -r "${ESCAPES}"'
            .runs[]?.results[]?
            | "::error title=Docker Scout - \((.ruleId // "?") | escprop)::\((.message.text // "see the report in the job summary") | .[0:200] | escmsg)"
          ' scout-gate.sarif; then
            echo "::warning title=Docker Scout annotations unavailable::Could not render per-finding annotations from scout-gate.sarif. The full table is in the job summary."
          fi

          echo "::error title=Image vulnerability gate::${CRITICAL} CRITICAL and ${HIGH} HIGH unwaived finding(s) in permitio/pdp-v2:next. Fix by upgrading the package, or - only with a written reachability argument - waive the CVE in BOTH .trivyignore.yaml and .docker/scout/pdp-v2.vex.json. See docs/image-vulnerability-management.md."
          exit 1

      - name: Upload SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scout-results.sarif

  # Immediate Slack alert when the image gate itself goes red - the PR comment and the
  # weekly digest are not enough on their own.
  #
  # NOT on pull_request, deliberately. A PR-gate failure is already in front of the one
  # person who can fix it: a red required check plus the `<!-- pdp-image-scan -->` sticky
  # comment on their own PR. Paging a channel for it trains everyone to mute the channel,
  # which is how the real alerts get lost. A failure on a push to main or on the
  # workflow_call path release.yml uses means something very different: the finding is
  # already merged, or is about to be published to Docker Hub. That is the one nobody is
  # looking at yet, so that is the one worth a message.
  #
  # `failure()` rather than a step-level check, because it also covers the runs where
  # docker-scout died before producing any counts at all.
  #
  # A separate job rather than a step, because ./.github/workflows/notify-slack.yml is a
  # reusable workflow and `uses:` at job level is the only way to call one. That is also
  # why there is no `env:` or `continue-on-error:` here - neither is permitted on a
  # `uses:` job, and the notifier already handles both internally: it no-ops green when
  # SLACK_WEBHOOK_URL is unset, and its own send step carries continue-on-error so a
  # Slack outage cannot mask the gate result.
  notify-gate-failure:
    needs: docker-scout
    # `needs.docker-scout.result == 'failure'`, NOT `failure()`. A job-level `failure()`
    # is true when ANY ancestor failed, and `build-pdp-image` is an ancestor of
    # docker-scout - so `failure()` would fire on a plain Dockerfile or build break and
    # announce "this is NOT a clean image" about an image that was never scanned. That
    # misdescribes a build break as a security finding, which is the fastest way to teach
    # people to ignore this channel. A build break leaves docker-scout `skipped` and is
    # already a red run on main; it does not need a security alert.
    #
    # Not on pull_request: a PR-gate failure is already in front of its author as a red
    # check and the sticky comment. A failure on main or on a release means it got IN,
    # which is the thing worth interrupting someone for.
    if: ${{ needs.docker-scout.result == 'failure' && github.event_name != 'pull_request' }}
    # `permissions` IS allowed on a `uses:` job even though `env` and `continue-on-error`
    # are not, and without it this job would hand the notifier whatever the repository
    # default grants. `contents: read` exactly mirrors what notify-slack.yml declares for
    # itself - a called workflow's permissions cannot exceed the caller's, so narrowing
    # further than the callee asks for would fail the run rather than tighten anything.
    permissions:
      contents: read
    uses: ./.github/workflows/notify-slack.yml
    with:
      subject: image vulnerability gate on ${{ github.ref_name }}
      status: fail
      # `parse_ok != 'true'` covers both an unparseable report and a docker-scout job that
      # never reached the report step, where every output is the empty string. Announcing
      # "0 CRITICAL / 0 HIGH" for either of those is the one message that would talk
      # someone out of opening the run.
      summary: |-
        ${{ needs.docker-scout.outputs.parse_ok == 'true' && format('{0} CRITICAL / {1} HIGH unwaived finding(s) in permitio/pdp-v2:next ({2} reported in total).', needs.docker-scout.outputs.critical, needs.docker-scout.outputs.high, needs.docker-scout.outputs.total) || 'The image scan did not complete - the report could not be produced or parsed. Failing closed: this is NOT a clean image.' }}
        Commit `${{ github.sha }}` on `${{ github.ref_name }}` (event: ${{ github.event_name }}).
        Fix by upgrading the package, or - only with a written reachability argument - waive the CVE in BOTH `.trivyignore.yaml` and `.docker/scout/pdp-v2.vex.json`. See docs/image-vulnerability-management.md.
    secrets:
      # Named rather than `secrets: inherit`, matching release.yml's call of the same
      # notifier. This workflow holds DOCKERHUB_TOKEN, CLONE_REPO_TOKEN and
      # PDP_TESTER_API_KEY; a workflow whose only job is to POST to an external webhook
      # has no business being handed any of them, and `inherit` hands over all three.
      # Naming a secret that does not exist yet is legal - it resolves to the empty
      # string and the notifier becomes a green no-op that says so in a ::notice::.
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  dependency-review:
    # The third scanner, and the only one that looks at the dependency DIFF rather than at
    # a built image: it blocks a PR that ADDS a high/critical advisory, where Dependabot's
    # own PRs only clean up advisories already on main. PDP is a public repository, so the
    # dependency graph and this action are free - no GitHub Advanced Security licence.
    #
    # PR-only, because the action diffs base-ref against head-ref and has neither on a
    # push or on the workflow_call path release.yml uses; it errors rather than no-ops
    # there. Deliberately not in any job's `needs:` - it is an independent gate and
    # chaining the image build behind it would only serialise CI.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Per-job, never workflow-level: a job-level permissions block REPLACES the
    # workflow-level one instead of merging, so introducing a workflow default here would
    # silently narrow every other job in this file.
    permissions:
      # read the dependency graph and the diff
      contents: read
      # write this action's own summary comment
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          show-patched-versions: true
          # This action posts its own sticky comment under its own marker, so it needs
          # none of the github-script plumbing the image report above does. `on-failure`
          # keeps a clean PR silent. `never` on fork and Dependabot PRs, where
          # GITHUB_TOKEN is read-only and the comment would 403 - the job summary still
          # carries the result there.
          comment-summary-in-pr: ${{ (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') && 'on-failure' || 'never' }}

  rust-ci:
    name: Rust CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: "rust-cache"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run cargo check
        run: cargo check --all --verbose

      - name: Run clippy
        run: cargo clippy --all -- -D warnings

      - name: Run tests
        run: cargo test --all --verbose
