name: PDP CI Tests

on:
  pull_request:
  push:
    branches: [ master, main, v* ]
  workflow_call:
    secrets:
      PDP_TESTER_API_KEY:
        required: true
      CLONE_REPO_TOKEN:
        required: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - uses: pre-commit/action@v3.0.1
  pytests:
    runs-on: ubuntu-latest
    steps:
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          # Keep in lockstep with the interpreter the image actually ships
          # (Dockerfile: python:3.13-alpine3.23). This job pinned 3.11.8 while the image
          # ran 3.10, so the unit suite never executed on the shipped interpreter and a
          # regression that only reproduces there could not fail CI. Patch version floats,
          # matching the Dockerfile base. Bump both together. See PER-15358.
          python-version: '3.13'

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Pytests
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
          pytest -s --cache-clear horizon/tests/

  build-pdp-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: permitio/permit-opa
          ref: main
          path: './permit-opa'
          token: ${{ secrets.CLONE_REPO_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pre build PDP tests
        run: |
          echo "next" > permit_pdp_version
          rm -rf custom
          mkdir custom
          build_root="$PWD"
          cd ./permit-opa
          find * \( -name '*go*' -o -name 'LICENSE.md' \) -print0 | xargs -0 tar -czf "$build_root"/custom/custom_opa.tar.gz --exclude '.*'

      - name: Build and load PDP Docker image
        uses: docker/build-push-action@v5
        with:
          push: false
          load: true
          context: .
          platforms: linux/amd64
          tags: permitio/pdp-v2:next
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image as artifact
        run: docker save permitio/pdp-v2:next -o pdp-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdp-image
          path: pdp-image.tar
          retention-days: 1

  pdp-tester:
    runs-on: ubuntu-latest
    needs: build-pdp-image
    # Cap the run so a hung tester fails fast instead of holding the runner
    # until GitHub's 360-minute default. The old k3d path was bounded by
    # `kubectl wait --timeout=600s`; the tester's own max_running_time only
    # applies in interval mode, not the run-once mode CI uses.
    timeout-minutes: 15
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: pdp-image

      - name: Load Docker image
        run: docker load -i pdp-image.tar

      # Checkout the pdp-tester repository
      - name: Checkout pdp-tester repository
        uses: actions/checkout@v4
        with:
          repository: "permitio/pdp-tester"
          token: ${{ secrets.CLONE_REPO_TOKEN }}
          path: './pdp-tester'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Cache pdp-tester's deps so each run doesn't re-resolve/re-download
          # from PyPI (faster, and resilient to transient PyPI outages).
          cache: "pip"
          cache-dependency-path: pdp-tester/pyproject.toml

      # Docker runtime backend: launch the PDP as a local container via aiodocker
      # (no k3d/Helm/kubectl). This is the runtime the pdp-tester maintainers
      # recommend for CI and sidesteps the AbsaOSS/k3d-action download breakage
      # (its default k3d v5.4.6 has no checksums.txt, so install.sh now 404s).
      - name: Install pdp-tester (docker extra)
        working-directory: ./pdp-tester
        run: pip install -e ".[docker]"

      - name: Run PDP tester against the local Docker PDP image
        working-directory: ./pdp-tester
        env:
          TOKEN: ${{ secrets.PDP_TESTER_API_KEY }}
          API_URL: https://permitio.api.stg.permit.io
          # Test the locally built image (loaded above) instead of pulling from
          # Docker Hub. LOCAL_IMAGE forces the runtime's local-only tag path, so
          # only permitio/pdp-v2:next is launched.
          LOCAL_IMAGE: permitio/pdp-v2
          # Preserve the previous Helm startTimeout, and keep crashed containers
          # around so the post-mortem step below can read their logs.
          START_TIMEOUT: "180"
          AUTO_REMOVE: "false"
        run: |
          set -o pipefail
          # The default GitHub Actions shell runs with `-e`, so capture the
          # tester's exit status explicitly (via `|| status=$?`) instead of
          # letting a non-zero exit abort the step before the log is parsed.
          status=0
          python -m pdp_tester --docker --local --tag next --skip-generate 2>&1 | tee /tmp/tester.log || status=$?
          if grep -q "test cases failed" /tmp/tester.log; then
            echo "::error::Some test cases failed!"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::pdp-tester exited with a non-zero status (${status})"
            exit 1
          fi

      - name: Capture PDP container state and logs
        if: always()
        run: |
          filter="label=pdp-tester.permit.io/managed-by=pdp-tester"
          echo "=== PDP containers (all states) ==="
          docker ps -a --filter "$filter" --format '{{.Names}}\t{{.Status}}' || true
          echo ""
          echo "=== PDP container logs ==="
          for name in $(docker ps -a --filter "$filter" --format '{{.Names}}'); do
            echo "--- ${name} ---"
            docker logs --tail 200 "$name" 2>&1 || true
          done

  docker-scout:
    runs-on: ubuntu-latest
    needs: build-pdp-image
    # Deliberately unconditional. This job used to carry
    # `if: github.event_name == 'pull_request'`, which meant the CVE gate ran on
    # pull requests only - never on the artifact customers actually pull.
    # release.yml calls this workflow with `uses:`, and inside a called workflow
    # github.event_name is the CALLER'S event ("release"), so the condition was
    # false on every release and the job was skipped. Verified on release
    # v0.9.14 (run 30900950607): `pdp-tests / docker-scout  skipped`, while
    # build-and-push-pdp went on to push :0.9.14 and :latest ungated. Pushes to
    # main were skipped for the same reason.
    #
    # Adding 'workflow_call' to the condition would NOT have fixed it - that is
    # not a value github.event_name ever takes. The trigger set in `on:` above
    # is already exactly the set we want scanned, so the correct fix is to have
    # no condition at all.
    #
    # This makes the gate release-blocking: release.yml has
    # build-and-push-pdp: needs: pdp-tests, so a new HIGH published between
    # merge and release cut now stops the Docker Hub push and the ECS redeploy.
    # That is the intent (PER-15532: a customer scan of 0.9.14-rc1 found CVEs CI
    # never flagged). Recovery is to fix the dependency or add a VEX statement
    # and re-cut the release.
    permissions:
      # required to upload the SARIF report
      security-events: write
      # required to download the Docker image artifact
      contents: read
      # required to create a pull request comment with the SARIF report
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: pdp-image

      - name: Load Docker image
        run: docker load -i pdp-image.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Scout CVE report (all severities)
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://permitio/pdp-v2:next
          exit-code: false
          sarif-file: scout-results.sarif
          summary: true
          # scout-action defaults write-comment to true. Now that this job also
          # runs on release and push events, where there is no PR to comment on,
          # gate it explicitly rather than relying on the action to work that
          # out for itself.
          write-comment: ${{ github.event_name == 'pull_request' }}

      - name: Docker Scout CVE gate (high and critical)
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://permitio/pdp-v2:next
          only-severities: critical,high
          exit-code: true
          # Only critical/high block. Medium and low are reported by the step
          # above and surfaced through the SARIF upload, but are non-blocking by
          # policy - they are triaged rather than gated. Live example: busybox
          # CVE-2025-60876, a medium with no upstream fix available.
          #
          # Accept CVEs marked not_affected in the OpenVEX doc (see
          # .docker/scout/pdp-v2.vex.json) so the gate does not fail on
          # vulnerabilities whose code path the PDP never executes and for which
          # no usable fix is available: starlette CVE-2026-48710 / CVE-2026-48817 /
          # CVE-2026-48818 / CVE-2026-54283, all fixed only in starlette >=1.x, which
          # OPAL's starlette<1 cap forbids; and ddtrace CVE-2026-50271, fixed only in
          # ddtrace >=4.8.2, which OPAL's ddtrace<4 cap forbids and which the
          # Dockerfile mitigates by dropping "baggage" from the extract styles.
          # (The VEX doc also carries CVE-2026-54282, but that one is low severity
          # and could never trip this gate - it is waived so the report step and any
          # future severity re-rating stay accurate.) See PER-15358.
          #
          # NOTE: this gate reads packages, so it does not flag the CPython interpreter
          # itself the way a CPE-based scanner does - that blind spot is why four Python
          # CVEs reached a customer scan of 0.9.14-rc1 without failing CI (PER-15532).
          #
          # NOTE: the scanned image is the single-arch linux/amd64 build produced by
          # build-pdp-image. The multi-arch artifact that release.yml publishes is not
          # what is scanned here, so linux/arm64 is not covered by this gate.
          vex-location: .docker/scout
          only-vex-affected: true
          # REQUIRED: docker scout only *applies* VEX statements whose author
          # matches its accept-list, which defaults to `<.*@docker.com>`. Without
          # this, our Permit.io-authored statements are matched and displayed
          # ("VEX: not affected") but NOT suppressed, so the gate still fails on
          # the waived CVEs. Must match the `author` field in pdp-v2.vex.json.
          vex-author: Permit.io
          # No PR to comment on for release/push events - see the report step.
          write-comment: ${{ github.event_name == 'pull_request' }}

      - name: Upload SARIF report
        # The file guard suppresses a second, misleading error when an earlier
        # step already failed the job and never produced the SARIF.
        if: always() && hashFiles('scout-results.sarif') != ''
        # This step is reporting, not gating - the gate is the step above. Now
        # that this job blocks releases, do not let a code-scanning upload
        # problem (processing error, API 5xx, size limit; upload-sarif defaults
        # wait-for-processing: true) fail pdp-tests and with it the Docker Hub
        # push and the ECS redeploy. A failed upload costs visibility, not
        # safety.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scout-results.sarif
          # codeql-action keys an analysis by `${workflowPath}:${jobName}`, and
          # resolves workflowPath from the run's own workflow. A release-triggered
          # run would therefore key as release.yml:docker-scout while PR and push
          # runs key as tests.yml:docker-scout, splitting the same job's results
          # across two analyses. Pin the category so all three agree.
          category: docker-scout

  rust-ci:
    name: Rust CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: "rust-cache"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run cargo check
        run: cargo check --all --verbose

      - name: Run clippy
        run: cargo clippy --all -- -D warnings

      - name: Run tests
        run: cargo test --all --verbose
