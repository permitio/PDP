name: Helm Release Workflow

on:
  push:
    paths:
      - 'charts/pdp/Chart.yaml'
  # Publishes the current chart version by hand, e.g. when the release after a version bump
  # failed. Re-running a failed run reuses that run's workflow file, so it can't pick up fixes.
  workflow_dispatch:

jobs:
  helm-release:
    if: github.ref == 'refs/heads/main'
    # chart-releaser creates the pdp-<version> GitHub release and pushes index.yaml to gh-pages
    # with CR_TOKEN, which is this job's GITHUB_TOKEN. The checkout still does not persist it.
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          skip_existing: true
          mark_as_latest: false
