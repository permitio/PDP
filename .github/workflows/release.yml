name: Build and Push PDP Docker Image

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  pdp-tests:
    # Call the reusable tests workflow.
    uses: ./.github/workflows/tests.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
      security-events: write

  build-and-push-pdp:
    needs: pdp-tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - uses: actions/checkout@v3
      with:
        repository: permitio/permit-opa
        ref: main
        path: './permit-opa'
        token: ${{ secrets.CLONE_REPO_TOKEN }}

    - name: Pre build PDP
      run: |
        echo "${{ github.event.release.tag_name }}" | cut -d '-' -f 1 > permit_pdp_version
        rm -rf custom
        mkdir custom
        build_root="$PWD"
        cd ./permit-opa
        find * \( -name '*go*' -o -name 'LICENSE.md' \) -print0 | xargs -0 tar -czf "$build_root"/custom/custom_opa.tar.gz --exclude '.*'

    - name: Build and push PDP image - (pre-release)
      if: "github.event.release.prerelease"
      uses: docker/build-push-action@v5
      with:
        push: true
        context: .
        platforms: linux/amd64,linux/arm64
        tags: permitio/pdp-v2:${{ github.event.release.tag_name }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        # Never serve the OS/dependency layers from the GHA cache. Their cache key is the
        # instruction text plus the parent layer, so a release cut weeks after the last
        # build replays the OLD `apk update && apk upgrade` + `pip install` results and
        # re-ships packages that upstream has since patched. That is exactly how
        # permitio/pdp-v2:0.9.14 came to carry openssl 3.5.7-r0 into a customer scan five
        # weeks after Alpine shipped 3.5.8-r0 (PER-15358). The expensive Rust stages
        # (rust_chef/rust_planner/rust_builder) still cache normally.
        no-cache-filter: main,opa_build

    - name: Build and push PDP image - (official release)
      if: "!github.event.release.prerelease"
      uses: docker/build-push-action@v5
      with:
        push: true
        context: .
        platforms: linux/amd64,linux/arm64
        tags: permitio/pdp-v2:${{ github.event.release.tag_name }},permitio/pdp-v2:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        # See the pre-release step above: forces `apk upgrade` and `pip install` to
        # re-resolve so a release can never republish a stale OS/dependency set.
        no-cache-filter: main,opa_build

  update-pdp-api-ecs-service:
    needs: build-and-push-pdp
    runs-on: ubuntu-latest
    if: "!github.event.release.prerelease"
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PDP_CICD_AWS_ROLE }}
          aws-region: us-east-1

      - name: Redeploy ECS service - pdp-general-redoc-service
        run: |
          aws ecs update-service \
            --cluster public-pdps-us-east-1 \
            --service pdp-general-redoc-service-731a74c \
            --force-new-deployment
