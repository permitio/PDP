name: Build and Push PDP Docker Image

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  pdp-tests:
    # Call the reusable tests workflow.
    uses: ./.github/workflows/tests.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      # REQUIRED, and easy to lose. tests.yml's docker-scout job logs in to Docker Hub
      # through OIDC, and a called workflow cannot be granted more than its caller's job
      # allows - this block, not the workflow-level one above. Drop this line and the CVE
      # gate passes on every PR (where tests.yml is the top-level workflow) and fails only
      # here, on a real release, at the Docker login.
      id-token: write

  build-and-push-pdp:
    needs: pdp-tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      with:
        persist-credentials: false

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Pinned; must match tests.yml, which says how to bump it and checks the two agree.
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      with:
        repository: permitio/permit-opa
        ref: ff2356d560e3c7152bcb6c6ab8ebd5d4eb691306  # permit-opa 0.0.23 (#52; go 1.26, x/crypto v0.57.0)
        path: './permit-opa'
        token: ${{ secrets.CLONE_REPO_TOKEN }}
        # Nothing after the clone needs the token; don't leave it in .git/config.
        persist-credentials: false

    - name: Pre build PDP
      shell: bash  # pipefail, for the tar pipeline
      run: |
        echo "${{ github.event.release.tag_name }}" | cut -d '-' -f 1 > permit_pdp_version
        rm -rf custom
        mkdir custom
        build_root="$PWD"
        cd ./permit-opa
        find * \( -name '*go*' -o -name 'LICENSE.md' \) -print0 | xargs -0 tar -czf "$build_root"/custom/custom_opa.tar.gz --exclude '.*'

    - name: Build and push PDP image - (pre-release)
      if: "github.event.release.prerelease"
      uses: docker/build-push-action@v5
      with:
        push: true
        context: .
        platforms: linux/amd64,linux/arm64
        tags: permitio/pdp-v2:${{ github.event.release.tag_name }}
        # rust_chef only, from tests.yml's "Cache the rust_chef stage" step (it runs in
        # pdp-tests above, and on every push to main). Never add a cache-to here: the
        # other stages see build inputs that must not sit in a cache every ref can
        # restore (opa_build's `COPY custom* /custom`, and the Rust stages' `COPY . .`,
        # which includes custom/), and the final image's layers all come from `main`,
        # which the filter below never serves from cache, so exporting them only fills
        # the cache. The final image takes only compiled binaries (/opa and /app/pdp)
        # from the other stages.
        cache-from: type=gha,scope=rust-chef
        # Never serve the `main` stage from the GHA cache. Its cache key is the instruction
        # text plus the parent layer, so when the base image digest has NOT moved but
        # Alpine's package index has, a release cut later replays the old
        # `apk update && apk upgrade` + `pip install` results and re-ships packages
        # upstream has since patched. That is the shape of PER-15358: 0.9.14 froze
        # libcrypto3 3.5.7-r0 on 2026-08-04 and Alpine published 3.5.8-r0 afterwards.
        #
        # NOTE the input is PLURAL. `no-cache-filter` (singular) is the buildx CLI flag;
        # the action input is `no-cache-filters`, and an undeclared input is warned about
        # and dropped - i.e. the singular spelling makes this silently inert.
        #
        # `opa_build` is deliberately NOT listed: `COPY custom* /custom` pulls in
        # custom_opa.tar.gz, which the Pre-build step regenerates every run, so that stage
        # re-executes from that COPY on, every run. The two layers before it
        # (`ENV GOTOOLCHAIN=local` and the go1.26.6 floor check) re-run too, since no
        # build exports opa_build to the cache; together they take about 2 seconds.
        # Listing the stage would imply this filter controls the OPA binary's Go
        # dependency versions, and it does not - those come from permit-opa's go.sum (see
        # permitio/permit-opa#49).
        #
        # The Rust stages are untouched by this filter. `rust_planner` and `rust_builder`
        # are never cached (no build exports them), and would barely cache anyway:
        # `rust_planner`'s `COPY . .` sees the regenerated tarball, so it and the final
        # `cargo zigbuild` re-run every build. `cargo chef cook` re-runs too despite being
        # keyed on recipe.json - 404.6s on tests.yml run 34858998837. The likely cause is
        # that no Cargo.lock is tracked (it is also .dockerignore'd), so `cargo chef prepare`
        # resolves crates.io fresh each build and the lock embedded in recipe.json drifts.
        # Do not budget this filter against a cached dependency compile.
        #
        # READ THAT MEASUREMENT NARROWLY: it comes from a `pull_request` run of tests.yml
        # built `--platform linux/amd64`. The rust stages are `--platform=$BUILDPLATFORM` and
        # do not depend on the target, so they build once and their cost carries over.
        # opa_build is `--platform=$BUILDPLATFORM` too but compiles once per target arch (two
        # cross-compiles on the amd64 host, no QEMU), and main is built twice with the arm64
        # leg under QEMU - and a tag ref restores
        # different GHA caches than a PR ref. Do not read that run's cache profile, or any
        # "longest step" ranking from it, as this step's.
        #
        # `rust_chef` is the one stage that IS cached, on purpose, in its own `rust-chef`
        # scope (a cold one costs about 4 minutes). Its
        # `apk add musl-dev openssl-dev zig pkgconf perl make`
        # is a package-resolving layer of exactly the class this filter exists to de-stale,
        # sitting outside the filter. Impact is limited because pdp-server vendors OpenSSL
        # (pdp-server/Cargo.toml) rather than linking that cached openssl-dev, so the
        # staleness stays in the build toolchain and never reaches the shipped image. That
        # also makes `openssl-dev` and `ENV OPENSSL_DIR=/usr` dead config; removing them is
        # out of scope here and tracked separately under PER-15358.
        no-cache-filters: main

    - name: Build and push PDP image - (official release)
      if: "!github.event.release.prerelease"
      uses: docker/build-push-action@v5
      with:
        push: true
        context: .
        platforms: linux/amd64,linux/arm64
        tags: permitio/pdp-v2:${{ github.event.release.tag_name }},permitio/pdp-v2:latest
        cache-from: type=gha,scope=rust-chef  # no cache-to - see the pre-release step
        # See the pre-release step above: forces `apk upgrade` and `pip install` to
        # re-resolve so a release can never republish a stale OS/dependency set.
        # Plural input, and `main` only - both for the reasons documented there.
        no-cache-filters: main

  # Scans the image that was ACTUALLY PUSHED, on both platforms, by digest.
  #
  # WHAT THIS ADDS. The pre-push gate is real - `build-and-push-pdp` needs `pdp-tests`,
  # and a called workflow's result is failure if any of its jobs fail, so a red Scout or
  # Trivy gate in tests.yml already blocks the push. But that gate scans
  # `permitio/pdp-v2:next`: a DIFFERENT image, built in a different job, `linux/amd64`
  # only (tests.yml), while the step above builds and pushes linux/amd64+linux/arm64.
  # Both builds carry `no-cache-filters: main`, which deliberately re-resolves
  # `apk upgrade` and `pip install` against live indexes - so the two builds can legally
  # resolve different package sets, and linux/arm64 is scanned by nothing at all. This
  # job turns "we scanned something like what shipped" into "we scanned exactly what
  # shipped, on both platforms", and it is the only place linux/arm64 is ever scanned.
  #
  # WHAT THIS CANNOT DO, stated plainly: it runs AFTER the push, so it cannot un-publish
  # the Docker Hub tag. By the time it goes red the tag is already pullable. What it buys
  # is (a) the truth, on the release run rather than from a customer six weeks later, and
  # (b) the ECS rollout below, which it blocks.
  #
  # UNEXERCISED UNTIL THE FIRST REAL RELEASE: this job cannot run on a pull request, so
  # the digest resolution and the arm64 scan are unproven in CI. The jq was walked by
  # hand against the live `permitio/pdp-v2:0.9.14` manifest list (an OCI image index with
  # four entries: linux/amd64, linux/arm64, and one attestation manifest per platform,
  # each carrying `.platform.architecture == "unknown"`). Trivy analyses layers
  # statically and never executes the image, so scanning an arm64 digest from an amd64
  # runner is expected to work - confirm that on the first release.
  verify-published-image:
    needs: build-and-push-pdp
    runs-on: ubuntu-latest
    # A hung scan here would hold the ECS rollout hostage until GitHub's 360-minute default.
    timeout-minutes: 30
    permissions:
      contents: read
      # required to upload the SARIF report to code scanning
      security-events: write
      # required for the Docker Hub OIDC login below (mints a GitHub ID token only)
      id-token: write
    strategy:
      # Scan both platforms even when one fails: an arm64-only regression is exactly the
      # thing that has never been visible before, and fail-fast would hide it behind an
      # amd64 failure.
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      IMAGE: permitio/pdp-v2:${{ github.event.release.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # Docker Hub rate-limits anonymous manifest reads, and a 429 here would fail a
      # release for a reason that has nothing to do with the image.
      #
      # OIDC, pull-only: the connection's `repo:permitio/PDP:*` rule matches a release
      # run's `sub` (`repo:permitio/PDP:ref:refs/tags/<tag>`) and grants pull on
      # permitio/pdp-v2, which is all a scan needs. The PUSH in build-and-push-pdp above
      # deliberately still uses DOCKERHUB_TOKEN - the connection grants no push scope, and
      # a push rule must be narrower than `:*` (tags only) before it is added.
      - name: Login to Docker Hub (OIDC)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          DOCKERHUB_OIDC_EXPIREIN: '1800'
        with:
          username: ${{ vars.DOCKERHUB_ORGANIZATION }}

      - name: Resolve the published per-platform digest
        id: digest
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # buildx ships preinstalled on ubuntu-latest, so there is no setup-buildx-action
          # step: adding one would mean pinning an action this change has no verified SHA
          # for. If buildx is ever missing, this command fails loudly, which is correct.
          raw="$(docker buildx imagetools inspect "$IMAGE" --raw)"
          # `.manifests[]?` yields nothing for a single-platform manifest (no `.manifests`
          # key at all) instead of erroring - the count check below turns that into a loud
          # failure rather than an empty scan that passes.
          #
          # The attestation filter is load-bearing. buildx attaches one attestation
          # manifest per platform; they are not images and Trivy fails confusingly on
          # them. They carry `.platform.architecture == "unknown"`, so the os/arch
          # selector already excludes them - the annotation check is the second lock,
          # because the day buildx stamps a real architecture on an attestation the first
          # one stops working silently.
          digests="$(printf '%s' "$raw" | jq -r --arg arch "$ARCH" '
            [ .manifests[]?
              | select(.platform.os == "linux" and .platform.architecture == $arch)
              | select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest")
              | .digest ]
            | unique | .[]')"
          count="$(printf '%s' "$digests" | grep -c . || true)"
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one linux/${ARCH} manifest in ${IMAGE}, found ${count}. The published tag is not the multi-platform index this job assumes; the raw manifest is in the step log. Refusing to report a release as scanned when it was not."
            printf 'raw manifest for %s:\n%s\n' "$IMAGE" "$raw" >&2
            exit 1
          fi
          # Scan BY DIGEST, not by tag. trivy-action v0.36.0 has no `platform` input, and
          # an undeclared input is dropped silently (the same trap as no-cache-filter(s)
          # above), so `platform:` would look deliberate and scan amd64 twice. A per-arch
          # digest resolves to a single-platform manifest, which needs no selector.
          echo "ref=${IMAGE%%:*}@${digests}" >> "$GITHUB_OUTPUT"
          echo "Resolved linux/${ARCH} of ${IMAGE} to ${IMAGE%%:*}@${digests}"

      # Same severity / vuln-type / trivyignore / ignore-unfixed settings as the PR gate
      # in tests.yml, so the two cannot disagree about what counts as a finding. The one
      # deliberate difference is `exit-code: '0'`: the pass/fail decision is made by the
      # separate fail step below, after the report has been rendered and uploaded.
      - name: Trivy scan the published image
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.digest.outputs.ref }}
          scanners: vuln
          severity: CRITICAL,HIGH
          # NOT `pkg-types`: the action's input is still `vuln-type`. See tests.yml.
          vuln-type: os,library
          trivyignores: .trivyignore.yaml
          format: json
          output: trivy-published-${{ matrix.arch }}.json
          exit-code: '0'
          # Report findings that have no fix yet rather than hiding them - an unfixable
          # CVE on a just-published image is precisely the one a human must see.
          ignore-unfixed: false

      - name: Trivy scan the published image (SARIF for code scanning)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.digest.outputs.ref }}
          scanners: vuln
          severity: CRITICAL,HIGH
          vuln-type: os,library
          trivyignores: .trivyignore.yaml
          format: sarif
          output: trivy-published-${{ matrix.arch }}.sarif
          exit-code: '0'
          # Without this, the action drops the severity filter for SARIF output and code
          # scanning gets every severity, not the CRITICAL,HIGH set the gate uses.
          limit-severities-for-sarif: true
          # Skips re-installing the Trivy binary; the DB is reused because the steps
          # share the same cache dir on disk.
          skip-setup-trivy: true

      # Uploaded BEFORE the fail step on purpose, so code scanning gets the findings from
      # exactly the run that blocked the rollout.
      - name: Upload SARIF report
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-published-${{ matrix.arch }}.sarif
          category: published-release-${{ matrix.arch }}

      - name: Render the scan report
        id: report
        if: ${{ !cancelled() }}
        env:
          REF: ${{ steps.digest.outputs.ref }}
          REPORT_JSON: trivy-published-${{ matrix.arch }}.json
        run: |
          set -euo pipefail
          if [ -z "${REF:-}" ]; then
            echo "::error::No image reference was resolved, so nothing was scanned. See the digest step above."
            exit 1
          fi
          # Docker Scout is deliberately not run here: it gates the pre-push image in
          # tests.yml against an OpenVEX doc whose statements bind to
          # `pkg:docker/permitio/pdp-v2@next` and match no release tag. Omitting
          # --scout-sarif renders "Docker Scout did not run" and leaves parse_ok true;
          # passing a path that does not exist would render "unavailable" and set
          # parse_ok false, which is a different claim.
          #
          # The formatter always exits 0 by design - never gate on its exit code. It
          # writes critical/high/total/parse_ok to $GITHUB_OUTPUT, and the fail step
          # below is what turns those into a red job.
          python3 .github/scripts/format_scan_report.py \
            --trivy "$REPORT_JSON" \
            --image "$REF" \
            --out scan-report.md \
            --github-output "$GITHUB_OUTPUT" > /dev/null
          cat scan-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw scan report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-published-${{ github.event.release.tag_name }}-${{ matrix.arch }}
          path: |
            trivy-published-${{ matrix.arch }}.json
            trivy-published-${{ matrix.arch }}.sarif
            scan-report.md
          retention-days: 30

      # `!cancelled()` rather than no `if:` at all: without it this step is skipped the
      # moment any earlier step fails, and a scan that crashed would report as a green
      # gate. That failure mode has already bitten the Trivy gate in tests.yml once.
      - name: Fail if the published image has CRITICAL/HIGH findings
        if: ${{ !cancelled() }}
        env:
          ARCH: ${{ matrix.arch }}
          REF: ${{ steps.digest.outputs.ref }}
          PARSE_OK: ${{ steps.report.outputs.parse_ok }}
          CRITICAL: ${{ steps.report.outputs.critical }}
          HIGH: ${{ steps.report.outputs.high }}
        run: |
          set -euo pipefail
          if [ -z "${PARSE_OK:-}" ]; then
            echo "::error::linux/${ARCH}: no scan report was produced for ${IMAGE}, so this image is UNVERIFIED. An earlier step in this job failed - fix that rather than re-running past it."
            exit 1
          fi
          if [ "$PARSE_OK" != "true" ]; then
            echo "::error::linux/${ARCH}: the Trivy report for ${REF} could not be parsed. Treating an unreadable report as clean is how a zero-byte file ships a vulnerable image; see the job summary."
            exit 1
          fi
          if [ "${CRITICAL:-0}" -ne 0 ] || [ "${HIGH:-0}" -ne 0 ]; then
            echo "::error::linux/${ARCH}: ${REF} has ${CRITICAL} CRITICAL / ${HIGH} HIGH findings. The tag is ALREADY on Docker Hub - this blocks the ECS rollout, it does not un-publish. Fix and cut a new release, or waive in .trivyignore.yaml AND .docker/scout/pdp-v2.vex.json."
            exit 1
          fi
          echo "linux/${ARCH}: ${REF} has no unwaived CRITICAL/HIGH findings."

  # Only on a genuine failure. `skipped` (the push job failed, so nothing was published)
  # and `cancelled` are not "the published image is bad" and must not say so.
  notify-release-scan:
    needs: verify-published-image
    if: ${{ always() && needs.verify-published-image.result == 'failure' }}
    uses: ./.github/workflows/notify-slack.yml
    secrets:
      # Named rather than `secrets: inherit`. This workflow holds DOCKERHUB_TOKEN,
      # CLONE_REPO_TOKEN, PDP_TESTER_API_KEY and PDP_CICD_AWS_ROLE; a workflow whose only
      # job is to POST to an external webhook has no business being handed any of them.
      # Naming a secret that does not exist is legal - it resolves to the empty string and
      # the notifier becomes a green no-op that says so in a ::notice::.
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    with:
      subject: release image scan
      status: fail
      # No `|` anywhere in this text: the notifier swaps it for U+2502 to keep caller text
      # out of Slack's link syntax. The run link is appended by the notifier itself.
      summary: >-
        *permitio/pdp-v2:${{ github.event.release.tag_name }}* is already published on
        Docker Hub and its post-push scan did not pass. The production ECS rollout is
        BLOCKED. Both linux/amd64 and linux/arm64 were scanned by digest - open the run
        to see which platform failed and why.

  update-pdp-api-ecs-service:
    # Blocked on verify-published-image as well as the push. The honest tradeoff: this
    # gate runs AFTER the Docker Hub push, so it cannot un-publish the tag - a customer
    # who pulls in that window gets the image either way. What it prevents is rolling a
    # CVE-bearing image out to the public PDP fleet, which is the part still under our
    # control. The cost is that a CVE disclosed between the build and the scan blocks an
    # operational deploy; that is the intended trade, not an accident.
    needs: [build-and-push-pdp, verify-published-image]
    runs-on: ubuntu-latest
    if: "!github.event.release.prerelease"
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PDP_CICD_AWS_ROLE }}
          aws-region: us-east-1

      - name: Redeploy ECS service - pdp-general-redoc-service
        run: |
          aws ecs update-service \
            --cluster public-pdps-us-east-1 \
            --service pdp-general-redoc-service-731a74c \
            --force-new-deployment
